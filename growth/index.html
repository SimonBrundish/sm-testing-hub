      <div><span class="label">Match your columns</span><div class="form-grid" style="margin-top:8px">${G.FIELDS.map(([k, label, req]) => `<label class="field"><span>${esc(label)}${req ? ' *' : ''}</span><select data-map="${k}">${opts(map[k])}</select></label>`).join('')}</div>
        <p class="sub" style="margin-top:6px">${byName ? '<b>No sex or date-of-birth column, so rows are matched by name to players already in the dashboard.</b> New players need the first-test sheet.' : 'New players need name, sex and date of birth. Rows without a test date, height and weight still add the player.'}</p></div>
      ${missing.length ? `<p class="err">Match a column for: ${missing.map(m => esc(m[1])).join(', ')}.</p>` : `
      <div class="panel" style="background:var(--surface-2);border:0"><b>${res.players.length} players · ${res.measurements} measurements · ${res.tests} test results</b>${existing ? ` · ${existing} already in the dashboard (new test dates are added to them)` : ''}
        ${res.errors.length ? `<details style="margin-top:6px"><summary class="err">${res.errors.length} row${res.errors.length === 1 ? '' : 's'} need attention</summary><ul class="sub">${res.errors.slice(0, 12).map(x => `<li>${esc(x)}</li>`).join('')}${res.errors.length > 12 ? `<li>and ${res.errors.length - 12} more</li>` : ''}</ul></details>` : ''}</div>
      ${sample ? `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Sex</th><th>Born</th><th>Squad</th><th class="n">Mother</th><th class="n">Father</th><th>Latest test</th><th class="n">Height</th><th class="n">Mass</th></tr></thead><tbody>${sample}</tbody></table></div><p class="sub">Showing the first ${Math.min(6, res.players.length)} players as they will be saved.</p>` : ''}
      <div class="bar"><div class="seg" role="group" aria-label="Import mode"><button data-imode="add" aria-pressed="${S.imode !== 'replace'}">Add to current data</button><button data-imode="replace" aria-pressed="${S.imode === 'replace'}">Replace all current data</button></div>
        ${S.confirm === 'imp-replace' ? `<span class="confirm"><span class="err">This deletes the ${S.players.length} players already here.</span><button class="btn danger" id="imp-go-confirm">Replace everything</button><button class="btn" data-cancel>Cancel</button></span>` : `<button class="btn primary" id="imp-go" ${res.players.length ? '' : 'disabled'}>Import ${res.players.length} players</button>`}</div>`}
    </div>`;
  }
  function viewData() {
    const examples = S.players.filter(p => p.example).length;
    const st = S.settings, conf = S.confirm;
    const numIn = (id, v, step = 0.1) => `<input type="number" id="${id}" value="${v}" step="${step}">`;
    const canDownload = !!store.downloads || !window.claude;
    const xlsxOK = !!window.XLSX;
    return `<section class="panel"><div class="panel-head"><div><h3>Import a spreadsheet</h3><p class="sub">Excel (.xlsx, .xls) or CSV, one row per test</p></div>
        <div class="bar"><button class="btn small" data-file="first">${canDownload && xlsxOK ? 'First-test template' : 'Copy first-test template'}</button><button class="btn small" data-file="follow">${canDownload && xlsxOK ? 'Later-tests template' : 'Copy later-tests template'}</button><button class="btn small" data-file="tests">${canDownload && xlsxOK ? 'Test results template' : 'Copy test results template'}</button></div></div>
      <p class="note" style="margin-bottom:12px">Two sheets: a <b>first test</b> for each new player (name, sex, date of birth, squad, parents' heights, height, weight), then <b>later tests</b> with just name, test date, height and weight. Later tests are matched to players by name.<br>Performance test results (the Testing Hub tests) can go in their own sheet with name, test date and a column per test, or import the Testing Hub's <b>data.json</b> file directly.</p>
      ${S.imp ? '' : `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">
        <label class="field"><span>Choose a file</span><input type="file" id="imp-file" accept=".xlsx,.xls,.xlsm,.csv,.tsv,.txt,.json"></label>
        <div class="field"><span>Or paste rows copied from a spreadsheet</span><textarea id="imp-text" rows="4" placeholder="Paste here, including the heading row"></textarea><div><button class="btn small" id="imp-paste">Use pasted rows</button></div></div></div>`}
      <div id="imp-area">${importArea()}</div>
      <div role="status" style="margin-top:8px">${S.msg.imp || ''}</div></section>
    <div class="grid2">
      <section class="panel"><div class="panel-head"><h3>Export</h3><span class="sub">${S.filter.squad !== 'all' || S.filter.sex !== 'all' || S.filter.q ? 'Results follow the Squad tab filters' : 'All players'}</span></div>
        <div style="display:grid;gap:12px">
          ${canDownload ? `<div class="bar">${xlsxOK ? '<button class="btn primary" data-file="xlsx">Download Excel workbook</button>' : ''}<button class="btn" data-file="results">Results CSV</button><button class="btn" data-file="raw">Measurements CSV</button></div>` : ''}
          <div class="bar"><button class="btn small" data-copy="results">Copy results</button><button class="btn small" data-copy="raw">Copy measurements</button><span class="sub" id="copy-msg" role="status"></span></div>
          <textarea id="exp-text" rows="6" readonly placeholder="Copied rows also appear here, so you can select them by hand."></textarea>
          <p class="sub">The workbook has a Results sheet (latest status for each player) and a Measurements sheet you can edit and re-import.</p>
        </div></section>
      <section class="panel"><div class="panel-head"><h3>Where the data lives</h3></div>
        <p class="note">${store.mode === 'supa' ? `${S.players.length} players and ${S.players.reduce((n, p) => n + p.assessments.length, 0)} measurements are saved in your academy's database. Every signed-in coach sees the same data; nobody can see it without signing in.` : store.mode === 'db'
        ? `${S.players.length} players and ${S.players.reduce((n, p) => n + p.assessments.length, 0)} measurements are saved with this dashboard, so they are the same on every device. People you share it with as Editor or Contributor can add and change data; Viewers can only look.`
        : `${S.players.length} players and ${S.players.reduce((n, p) => n + p.assessments.length, 0)} measurements are saved in this browser only. Download a copy after each testing block.`}</p>
        <div class="bar" style="margin-top:10px">
          ${examples ? `<button class="btn" id="rm-examples">Remove ${examples} example players</button>` : `<button class="btn" id="load-examples">Add example squad</button>`}
          ${conf === 'clear' ? `<span class="confirm"><span class="err">Delete every player and measurement?</span><button class="btn danger" id="clear-go">Delete all</button><button class="btn" data-cancel>Keep</button></span>` : `<button class="btn danger" data-ask="clear">Clear all data</button>`}
        </div></section>
      <section class="panel" style="grid-column:1/-1"><div class="panel-head"><h3>Settings</h3><button class="linkish" id="set-reset">Restore defaults</button></div>
        <form id="settings" style="display:grid;gap:14px">
          <div class="form-grid"><label class="field"><span>Approaching from % PAH</span>${numIn('s-c0', st.statusCuts[0])}</label><label class="field"><span>Circa from % PAH</span>${numIn('s-c1', st.statusCuts[1])}</label><label class="field"><span>Post from % PAH</span>${numIn('s-c2', st.statusCuts[2])}</label>
          <label class="field"><span>Slightly early/late at ± yr</span>${numIn('s-t0', st.timingCuts[0])}</label><label class="field"><span>Early/late at ± yr</span>${numIn('s-t1', st.timingCuts[1])}</label></div>
          <div class="form-grid"><label class="field"><span>Height moderate from cm/yr</span>${numIn('s-h0', st.heightTempo[0])}</label><label class="field"><span>Height high from cm/yr</span>${numIn('s-h1', st.heightTempo[1])}</label><label class="field"><span>Mass moderate from kg/yr</span>${numIn('s-w0', st.weightTempo[0])}</label><label class="field"><span>Mass high from kg/yr</span>${numIn('s-w1', st.weightTempo[1])}</label>
          <label class="field"><span>Re-measure after (days)</span>${numIn('s-stale', st.staleDays, 1)}</label><label class="field"><span>Short interval under (days)</span>${numIn('s-short', st.shortIntervalDays, 1)}</label></div>
          <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s-self" ${st.parentsSelfReported ? 'checked' : ''}> Parent heights are self-reported (apply the Khamis-Roche adjustment)</label>
          <div><button class="btn" type="submit">Save settings</button> <span class="ok" role="status">${esc(S.msg.s || '')}</span></div></form></section>
    </div>`;
  }

  function viewMethod() {
    return `<article class="panel method">
      <h2>How the numbers are worked out</h2>
      <p>The dashboard reproduces the existing Maturation Calculator. On its sample inputs (boy, born 6 Oct 2012, tested 3 Oct 2026, 160 cm, 50 kg, parents 165 and 180 cm) it gives the same predicted adult height (176.1 cm), % adult height (90.9%), status (Circa-PHV), timing (On time) and height bounds; biological age differs by 0.01 years.</p>
      <h3>Predicted adult height</h3>
      <p>Khamis-Roche (1994): a regression on the player's height, body mass and mid-parent height, with coefficients for each half-year of age from 4 to 17.5. Age is rounded to the nearest half year. Parent heights are adjusted for self-report bias (Epstein et al.) before averaging, which the method recommends; switch this off in Settings if parents were measured.</p>
      <h3>Height bounds</h3>
      <p>50% and 90% ranges around the prediction, by age. They match the current calculator and report between ages 9.5 and 15.5; outside that span they are extrapolated, so treat them as approximate.</p>
      <h3>Maturity status</h3>
      <p>Current height as a percentage of predicted adult height (Cumming et al., 2017): Pre-PHV under ${S.settings.statusCuts[0]}%, Approaching-PHV ${S.settings.statusCuts[0]}–${S.settings.statusCuts[1]}%, Circa-PHV ${S.settings.statusCuts[1]}–${S.settings.statusCuts[2]}% and Post-PHV ${S.settings.statusCuts[2]}% and over. Growth typically peaks around 91–92%.</p>
      <h3>Biological age and timing</h3>
      <p>Biological age is the age at which an average child (UK90 median) has reached the same % of adult height. BA − CA within ±${S.settings.timingCuts[0]} years is on time, ±${S.settings.timingCuts[0]}–${S.settings.timingCuts[1]} slightly early or late, and beyond ±${S.settings.timingCuts[1]} early or late. The LTAD guide's three-way split (±1 year) is the outer pair.</p>
      <h3>Growth rate and tempo</h3>
      <p>Change in height and body mass since the previous measurement, scaled to a year. Gaps under ${S.settings.shortIntervalDays} days are flagged because a few millimetres of measurement error becomes a large annual rate. Height growth of ${S.settings.heightTempo[1]} cm/yr or more is high (Kemper et al., 2015) and is linked to higher injury risk; a player who is also Circa-PHV is flagged first. A ~12-month rate is shown on the player page when a measurement 9–15 months earlier exists.</p>
      <h3>Performance tests by age and by maturity</h3>
      <p>For each test result the dashboard estimates the player's maturity on the test date, from height and body mass measured on or around that day (interpolated between measurements up to 400 days apart, or the nearest within 60 days). The result is then compared two ways with other players' tests from any date: against players of the same sex at the same <b>chronological age</b>, and against players at the same <b>biological age</b>. In each case a straight line is fitted through tests within ±${G.NORMS.window} years (±${G.NORMS.wide} if there are too few), and the percentile is how far the result sits above or below that line. At least ${G.NORMS.minPlayers} other players and ${G.NORMS.minTests} tests are needed. The player's own tests are left out. With a small squad the comparison groups are small, so read percentiles as a guide; they firm up as each testing round adds data.</p>
      <h3>Checks</h3>
      <ul><li>Measure each quarter, and within ±30 days (ideally ±7) of testing or competition.</li><li>Does the growth rate fit the status? A Post-PHV player growing fast, or a height that went down, is flagged as a data check.</li><li>Predictions need biological parents' heights. Without them the player is listed but not banded.</li></ul>
      <h3>Sources</h3>
      <p class="sub">Khamis &amp; Roche, Pediatrics 1994;94:504–507 · Epstein et al., Am J Epidemiol 1995 · Cole, Freeman &amp; Preece 1998 (UK90) · Cumming et al., Strength Cond J 2017;39(2):34–47 · Baker, LTAD Network growth and maturation guide.</p>
    </article>`;
  }

  // ---------- render ----------
  function render() {
    CHARTS.clear();
    $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
    const examples = S.players.filter(p => p.example).length;
    const oldLocal = false && S.loaded ? store.localOld.filter(p => !S.players.some(x => uniqueKey(x) === uniqueKey(p))) : [];
    $('#banner').innerHTML =
      (store.error ? `<div class="banner" style="background:var(--surface);color:var(--critical);border:1px solid var(--critical)"><span>${esc(store.error)}</span><button class="btn small" id="err-x">Dismiss</button></div>` : '') +
      (oldLocal.length ? `<div class="banner"><span><b>${oldLocal.length} player${oldLocal.length === 1 ? '' : 's'} saved in this browser</b> from the earlier version are not in the shared dashboard yet.</span><button class="btn small" id="mig-go">Move them in</button></div>` : '') +
      (examples ? `<div class="banner"><span><b>Example squad.</b> ${examples} made-up players are here so you can see the dashboard working. Remove them before importing your own data.</span><button class="btn small" id="rm-examples-top">Remove examples</button></div>` : '');
    const acc = $('#account');
    if (acc) acc.innerHTML = store.mode === 'supa' && store.user ? `<span class="sub">${esc(store.user.email || 'Signed in')}</span><button class="linkish" id="sign-out">Sign out</button>` : '';
    if (store.mode === 'supa' && (!store.user || S.recovery || S.notCoach) && S.tab !== 'calculator' && S.tab !== 'method') { $('#view').innerHTML = viewLogin(); return; }
    const loading = store.mode === 'starting' || ((store.mode === 'db' || store.mode === 'supa') && !S.loaded);
    if (loading && S.tab !== 'calculator' && S.tab !== 'method') { $('#view').innerHTML = `<div class="panel"><h3>Loading squad data</h3><p class="sub">Fetching players and measurements.</p></div>`; return; }
    const v = { squad: viewSquad, player: viewPlayer, perf: viewPerf, record: viewRecord, calculator: viewCalculator, data: viewData, method: viewMethod }[S.tab];
    $('#view').innerHTML = v();
    drawCharts();
  }
  function setTab(t) { S.tab = t; S.confirm = null; S.msg = {}; try { history.replaceState(null, '', '#' + t); } catch (e) { } render(); window.scrollTo(0, 0); }
  function openPlayer(id) { S.playerId = id; setTab('player'); }
  const current = () => S.players.find(x => x.id === S.playerId);

  // ---------- files out ----------
  function workbook(kind) {
    const X = window.XLSX, wb = X.utils.book_new();
    if (kind === 'first') {
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(TEMPLATES.first), 'First test');
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['First test: one row per new player'], ['Name: as you will write it on every later test sheet'], ['Sex: M or F'], ['Date of birth and test date: DD/MM/YYYY or YYYY-MM-DD'], ["Parents' heights in cm (biological parents). Needed for predicted adult height"], ['Height in cm, weight in kg'], ['Delete the example row before importing']]), 'Notes');
    } else if (kind === 'follow') {
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(TEMPLATES.follow), 'Tests');
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['Later tests: one row per player per test'], ['Name must match the name used on the first-test sheet'], ['Test date: DD/MM/YYYY or YYYY-MM-DD'], ['Height in cm, weight in kg'], ['Delete the example rows before importing']]), 'Notes');
    } else if (kind === 'tests') {
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(TEMPLATES.tests), 'Test results');
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['Test results: one row per player per testing session'], ['Name must match the name already in the dashboard'], ['Test date: DD/MM/YYYY or YYYY-MM-DD'], ['Leave a test blank if it was not done'], ['Height is optional; weight comes from the growth measurements'], ['Delete the example row before importing']]), 'Notes');
    } else {
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(G.resultsRows(filtered())), 'Results');
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(G.rawRows(S.players)), 'Measurements');
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(G.testRows(S.players)), 'Test results');
    }
    return X.write(wb, { bookType: 'xlsx', type: 'array' });
  }
  async function offerFile(filename, data) {
    const msg = $('#copy-msg');
    if (store.downloads) {
      try { await store.downloads.save({ filename, data }); return true; }
      catch (e) { if (e && e.code === 'declined') return true; if (msg) msg.textContent = 'Download is not available here. Use Copy instead.'; return false; }
    }
    if (!window.claude) { // opened as a local file: a plain link works
      const url = URL.createObjectURL(new Blob([data])); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return true;
    }
    return false;
  }
  const stamp = () => todayISO();
  const TEMPLATES = {
    first: [['Name', 'Sex', 'Date of birth', 'Squad', "Mother's height (cm)", "Father's height (cm)", 'Test date', 'Height (cm)', 'Weight (kg)'], ['Jane Example', 'F', '21/04/2013', 'U13', 165, 180, '14/09/2026', 152.4, 41.2]],
    follow: [['Name', 'Test date', 'Height (cm)', 'Weight (kg)'], ['Jane Example', '10/12/2026', 154.1, 42.6], ['Jane Example', '15/03/2027', 155.9, 43.8]],
    tests: [['Name', 'Test date', 'Height (cm)', ...G.METRICS.map(m => m.label + (m.unit ? ` (${m.unit})` : ''))], ['Jane Example', '14/09/2026', 152.4, 2.05, 3.98, 27.5, 19.2, 151, 2.62, 310, 5.21, 5.3]]
  };

  // ---------- import ----------
  async function readImportFile(file) {
    S.msg.imp = ''; S.confirm = null;
    try {
      if (/\.json$/i.test(file.name)) {
        let json; try { json = JSON.parse(await file.text()); } catch (e) { throw new Error('That JSON file could not be read.'); }
        setImport([{ name: 'Testing Hub', rows: G.testingHubRows(json) }], file.name);
      } else if (/\.(csv|tsv|txt)$/i.test(file.name) || !window.XLSX) {
        if (!/\.(csv|tsv|txt)$/i.test(file.name)) throw new Error('Excel files cannot be read here right now. Save the sheet as CSV and choose that instead.');
        setImport([{ name: file.name, rows: G.parseCSV(await file.text()) }], file.name);
      } else {
        const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
        const sheets = wb.SheetNames.map(n => ({ name: n, rows: window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }) })).filter(s => s.rows.length);
        if (!sheets.length) throw new Error('That workbook has no rows to import.');
        setImport(sheets, file.name);
      }
    } catch (err) { S.imp = null; S.msg.imp = `<span class="err">${esc(err.message || 'That file could not be read.')}</span>`; }
    render();
  }
  async function runImport(replace) {
    const res = importResult();
    S.confirm = null;
    const { changed, removed } = mergePlayers(res.players, replace);
    S.imp = null;
    S.msg.imp = `<span class="sub">Saving ${changed.length} players…</span>`;
    const ok = await persist(changed, removed);
    S.msg.imp = ok ? `<span class="ok">Imported ${res.measurements} measurements and ${res.tests} test results for ${res.players.length} players.</span>` + (res.errors.length ? ` <span class="err">${res.errors.length} row${res.errors.length === 1 ? '' : 's'} skipped or incomplete.</span>` : '') : '';
    render();
  }

  // ---------- events ----------
  document.addEventListener('click', async e => {
    const t = e.target;
    const tab = t.closest('.tab'); if (tab) return setTab(tab.dataset.tab);
    const go = t.closest('[data-goto]'); if (go) return setTab(go.dataset.goto);
    const sortB = t.closest('[data-sort]');
    if (sortB) { const k = sortB.dataset.sort; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : (k === 'name' || k === 'squad' ? 1 : -1) }; return render(); }
    const sexB = t.closest('[data-sex]'); if (sexB) { S.filter.sex = sexB.dataset.sex; save(); return render(); }
    const imode = t.closest('[data-imode]'); if (imode) { S.imode = imode.dataset.imode; S.confirm = null; $('#imp-area').innerHTML = importArea(); return; }
    const nav = t.closest('[data-nav]');
    if (nav) { const all = filtered().length ? filtered() : profiles(); const i = all.findIndex(x => x.id === S.playerId) + (+nav.dataset.nav); if (all[i]) { S.playerId = all[i].id; S.confirm = null; S.msg = {}; render(); } return; }
    const row = t.closest('[data-pid]'); if (row && !t.closest('button')) return openPlayer(row.dataset.pid);
    const ask = t.closest('[data-ask]'); if (ask) { S.confirm = ask.dataset.ask; return render(); }
    if (t.closest('[data-cancel]')) { S.confirm = null; return render(); }
    if (t.id === 'err-x') { store.error = ''; return render(); }
    if (t.id === 'sign-out' && store.sb) { await store.sb.auth.signOut(); S.msg = {}; return; }
    if (t.id === 'lg-forgot' && store.sb) {
      const email = $('#lg-email').value.trim(); S.loginEmail = email;
      if (!email) { S.msg = { login: 'Enter your email first, then choose Forgot your password.' }; return render(); }
      const { error } = await store.sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
      S.msg = error ? { login: error.message } : { login: 'Check your email for a link to choose a new password.', loginOk: true }; return render();
    }
    const pax = t.closest('[data-paxis]'); if (pax) { S.paxis = pax.dataset.paxis; return render(); }
    const delT = t.closest('[data-del-t]');
    if (delT) { const p = current(); p.tests = (p.tests || []).filter(x => G.iso(G.parseDate(x.date)) !== delT.dataset.delT); S.confirm = null; return persist([p]); }
    const delA = t.closest('[data-del-a]');
    if (delA) { const p = current(); p.assessments = p.assessments.filter(a => G.iso(G.parseDate(a.date)) !== delA.dataset.delA); S.confirm = null; return persist([p]); }
    if (t.closest('[data-del-p]')) { const id = S.playerId; S.players = S.players.filter(x => x.id !== id); S.playerId = null; S.confirm = null; return persist([], [id]); }
    if (t.id === 'rm-examples' || t.id === 'rm-examples-top') { const ids = S.players.filter(p => p.example).map(p => p.id); S.players = S.players.filter(p => !p.example); S.playerId = null; return persist([], ids); }
    if (t.id === 'load-examples') { const add = G.demoSquad().filter(p => !S.players.some(x => x.id === p.id)); S.players = S.players.concat(add); return persist(add); }
    if (t.id === 'clear-go') { const ids = S.players.map(p => p.id); S.players = []; S.confirm = null; S.playerId = null; return persist([], ids); }
    if (t.id === 'mig-go') { const { changed } = mergePlayers(store.localOld.map(p => ({ ...p, id: p.id || uid() })), false); store.localOld = []; try { localStorage.setItem(KEY, JSON.stringify({ players: [], filter: S.filter })); } catch (err) { } return persist(changed); }
    if (t.id === 'c-reset') { calc = { ...CALC_DEFAULT }; S.msg.c = ''; return render(); }
    if (t.id === 'set-reset') { S.settings = { ...G.DEFAULT_SETTINGS }; S.msg.s = 'Defaults restored.'; return persistSettings(); }
    if (t.id === 'c-add') {
      const name = calc.name.trim() || 'Unnamed player';
      const a = { date: calc.date, height: +calc.height, mass: +calc.mass };
      let ex = S.players.find(x => uniqueKey(x) === uniqueKey({ name, dob: calc.dob }));
      if (ex) { ex.assessments = ex.assessments.filter(b => b.date !== a.date).concat(a); S.msg.c = `Added a measurement to ${ex.name}.`; }
      else { ex = { id: uid(), name, squad: '', sex: calc.sex, dob: calc.dob, mother: +calc.mother || null, father: +calc.father || null, assessments: [a] }; S.players.push(ex); S.msg.c = `Added ${name} to the squad.`; }
      await persist([ex]); return;
    }
    if (t.id === 'imp-paste') { const text = $('#imp-text').value; if (!text.trim()) return; S.msg.imp = ''; setImport([{ name: 'Pasted rows', rows: G.parseCSV(text) }], 'Pasted rows'); return render(); }
    if (t.id === 'imp-cancel') { S.imp = null; S.confirm = null; return render(); }
    if (t.id === 'imp-go') { if (S.imode === 'replace' && S.players.length) { S.confirm = 'imp-replace'; $('#imp-area').innerHTML = importArea(); return; } return runImport(S.imode === 'replace'); }
    if (t.id === 'imp-go-confirm') return runImport(true);
    if (t.id === 'ses-save') {
      const ses = S.session, changed = [];
      for (const [id, v] of Object.entries(ses.vals)) {
        const p = S.players.find(x => x.id === id), h = G.heightCm(v.h), m = parseFloat(v.m);
        if (!p || !(h > 0) || !(m > 0)) continue;
        p.assessments = p.assessments.filter(a => a.date !== ses.date).concat({ date: ses.date, height: h, mass: m });
        changed.push(p);
      }
      if (!changed.length) { S.msg.ses = '<span class="err">Enter a height and body mass for at least one player.</span>'; return render(); }
      ses.vals = {};
      S.msg.ses = `<span class="ok">Saved ${changed.length} measurement${changed.length === 1 ? '' : 's'} for ${esc(ses.squad)} on ${fmtDate(ses.date)}.</span>`;
      return persist(changed);
    }
    const fileB = t.closest('[data-file]');
    if (fileB) {
      const k = fileB.dataset.file;
      const ok = k === 'xlsx' ? await offerFile(`growth-maturation-${stamp()}.xlsx`, workbook('all'))
        : k === 'first' || k === 'follow' || k === 'tests' ? (window.XLSX ? await offerFile(`supermovers-${k === 'first' ? 'first-test' : k === 'tests' ? 'test-results' : 'test'}-template.xlsx`, workbook(k)) : false)
        : await offerFile(`growth-maturation-${k === 'results' ? 'results' : 'measurements'}-${stamp()}.csv`, k === 'results' ? G.resultsCSV(filtered()) : G.rawCSV(S.players));
      if (!ok && (k === 'first' || k === 'follow' || k === 'tests')) { const csv = G.toCSV(TEMPLATES[k]); try { await navigator.clipboard.writeText(csv); fileB.textContent = 'Template copied'; } catch (err) { const ta = $('#imp-text'); if (ta) { ta.value = csv; ta.focus(); ta.select(); } } }
      return;
    }
    const copyB = t.closest('[data-copy]');
    if (copyB) {
      const text = copyB.dataset.copy === 'results' ? G.resultsCSV(filtered()) : G.rawCSV(S.players);
      const ta = $('#exp-text'); if (ta) ta.value = text;
      const msg = $('#copy-msg');
      try { await navigator.clipboard.writeText(text); if (msg) msg.textContent = 'Copied. Paste into Excel or Sheets.'; }
      catch (err) { if (ta) { ta.focus(); ta.select(); } if (msg) msg.textContent = 'Select the text below and copy it.'; }
      return;
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('tr[data-pid]')) openPlayer(e.target.dataset.pid); });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'f-q') { S.filter.q = t.value; save(); const pos = t.selectionStart; render(); const q = $('#f-q'); q.focus(); q.setSelectionRange(pos, pos); }
    if (t.id && t.id.startsWith('c-')) { const k = t.id.slice(2); if (k in calc) { calc[k] = t.value; S.msg.c = ''; $('#calc-out').innerHTML = calcOut(); } }
    if (t.dataset.sid) {
      const id = t.dataset.sid, v = S.session.vals[id] = S.session.vals[id] || {};
      v[t.dataset.k] = t.value;
      const p = profiles().find(x => x.id === id), cell = document.getElementById('sc-' + id);
      if (p && cell) cell.innerHTML = sessionCheck(p, v.h, v.m, S.session.date);
      const list = profiles().filter(x => (x.squad || 'No squad') === S.session.squad);
      const n = list.filter(x => { const w = S.session.vals[x.id]; return w && G.heightCm(w.h) > 0 && parseFloat(w.m) > 0; }).length;
      const c = $('#ses-count'); if (c) c.textContent = `${n} of ${list.length} filled in`;
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'f-squad') { S.filter.squad = t.value; save(); render(); }
    if (t.id === 'pm-metric') { S.metric = t.value; render(); }
    if (t.id === 'pick') { S.playerId = t.value; S.confirm = null; S.msg = {}; render(); }
    if (t.id === 'imp-file' && t.files[0]) readImportFile(t.files[0]);
    if (t.id === 'imp-sheet') { S.imp.sheet = +t.value; remapImport(); $('#imp-area').innerHTML = importArea(); }
    if (t.id === 'imp-header') { const n = Math.max(1, Math.min(+t.value || 1, S.imp.sheets[S.imp.sheet].rows.length)); S.imp.header = n - 1; remapImport(true); $('#imp-area').innerHTML = importArea(); }
    if (t.dataset.map) { S.imp.map[t.dataset.map] = +t.value; S.confirm = null; $('#imp-area').innerHTML = importArea(); }
    if (t.id === 'ses-squad') { S.session.squad = t.value; S.msg.ses = ''; render(); }
    if (t.id === 'ses-date') { S.session.date = t.value || todayISO(); render(); }
  });
  document.addEventListener('submit', async e => {
    e.preventDefault();
    const id = e.target.id;
    if (id === 'login' && store.sb) {
      const email = $('#lg-email').value.trim(), password = $('#lg-pw').value; S.loginEmail = email;
      S.msg = { login: 'Signing in…', loginOk: true }; render();
      const { error } = await store.sb.auth.signInWithPassword({ email, password });
      S.msg = error ? { login: error.message === 'Invalid login credentials' ? 'That email and password do not match an account.' : error.message } : {};
      return render();
    }
    if (id === 'newpw' && store.sb) {
      const { error } = await store.sb.auth.updateUser({ password: $('#np-pw').value });
      if (error) { S.msg = { login: error.message }; return render(); }
      S.recovery = false; S.msg = {}; loadSupabase(); return render();
    }
    if (id === 'add-a') {
      const p = current();
      const date = $('#a-date').value, height = parseFloat($('#a-height').value), mass = parseFloat($('#a-mass').value);
      if (!date || !(height > 0) || !(mass > 0)) { S.msg = { a: 'Enter a date, height and body mass.' }; return render(); }
      p.assessments = p.assessments.filter(a => a.date !== date).concat({ date, height, mass });
      S.msg = {}; return persist([p]);
    }
    if (id === 'edit-p') {
      const p = current(); const v = readPlayerFields('e');
      if (!v.name || !v.dob) return;
      Object.assign(p, v); S.msg = { e: 'Saved.' }; return persist([p]);
    }
    if (id === 'new-p') {
      const v = readPlayerFields('n'); if (!v.name || !v.dob) return;
      if (S.players.some(x => uniqueKey(x) === uniqueKey(v))) { S.msg = { n: `${v.name} with that date of birth is already in the dashboard.` }; return render(); }
      const date = $('#n-date').value, height = parseFloat($('#n-height').value), mass = parseFloat($('#n-mass').value);
      const p = { id: uid(), ...v, assessments: date && height > 0 && mass > 0 ? [{ date, height, mass }] : [] };
      S.players.push(p); S.msg = { n: `Added ${v.name}.` };
      if (v.squad) S.session.squad = v.squad;
      return persist([p]);
    }
    if (id === 'settings') {
      const n = id => parseFloat($('#' + id).value);
      const cuts = [n('s-c0'), n('s-c1'), n('s-c2')];
      if (cuts.some(isNaN) || !(cuts[0] < cuts[1] && cuts[1] < cuts[2])) { S.msg = { s: 'Status cut-offs must increase.' }; return render(); }
      S.settings = { statusCuts: cuts, timingCuts: [n('s-t0'), n('s-t1')], heightTempo: [n('s-h0'), n('s-h1')], weightTempo: [n('s-w0'), n('s-w1')], staleDays: n('s-stale'), shortIntervalDays: n('s-short'), parentsSelfReported: $('#s-self').checked };
      S.msg = { s: 'Saved.' }; return persistSettings();
    }
  });

  let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(drawCharts, 80); }).observe(document.getElementById('view'));
  // Embedded on another site: tell the host page our height so its iframe can grow to fit.
  if (window.parent !== window && !window.claude) {
    let last = 0;
    const post = () => { const h = Math.ceil(document.documentElement.scrollHeight); if (h !== last) { last = h; window.parent.postMessage({ type: 'supermovers-gm-height', height: h }, '*'); } };
    new ResizeObserver(post).observe(document.body); post();
  }
  startStore();
})();
</script>
</body>
