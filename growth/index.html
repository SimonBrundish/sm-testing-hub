<title>Supermovers Growth &amp; Maturation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a working tool. Sticky top bar with view tabs, then a 12-column content well;
   summary before detail on every view, per-player row charts that read like the paper report. */
:root {
  --bg: #f4f4f8;
  --surface: #ffffff;
  --surface-2: #eeeef5;
  --ink: #141a22;
  --ink-2: #4c5664;
  --muted: #7a8391;
  --line: #dfe3e8;
  --line-strong: #c4cad2;
  /* Supermovers shield stripes */
  --sm-orange: #f29222; --sm-red: #ba171f; --sm-navy: #2a2f6d; --sm-blue: #1b75bc; --sm-green: #46ae4d;
  --accent: #2a2f6d;
  --accent-ink: #ffffff;
  --accent-soft: #e4e5f2;
  --header-bg: #ffffff; --header-ink: #1b1f3b; --header-muted: #5d6280; --header-line: #e3e4ee;
  --example: #fff4d6;
  --example-ink: #6b4e00;

  /* maturity status: ordinal green ramp */
  --st-0: #a3dcc4; --st-1: #52bc95; --st-2: #1b8a63; --st-3: #0b553d;
  /* maturity timing: diverging blue (late) / grey / red (early) */
  --tm-0: #1c5cab; --tm-1: #86b6ef; --tm-2: #c9c8c1; --tm-3: #ef9d9b; --tm-4: #c23434;
  /* tempo: ordinal orange ramp */
  --tp-0: #f4cba5; --tp-1: #e8884c; --tp-2: #b04512;
  /* status palette for flags */
  --good: #0ca30c; --warning: #c98500; --serious: #d9692f; --critical: #d03b3b;

  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --r: 10px;
  --gap: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --surface: #171a2b; --surface-2: #20243a; --ink: #eef2f6; --ink-2: #b6bfca; --muted: #8590a0;
    --line: #29313b; --line-strong: #3a4450; --accent: #6f9be8; --accent-ink: #0b1220; --accent-soft: #1d2a47;
    --example: #3a2f10; --example-ink: #f3d68a;
    --st-0: #1d6e52; --st-1: #2a9d74; --st-2: #5cc9a3; --st-3: #a8e6cf;
    --tm-0: #4f8fe0; --tm-1: #2a5288; --tm-2: #4a4d52; --tm-3: #8f3a3a; --tm-4: #e66767;
    --tp-0: #7a3a14; --tp-1: #cf6a30; --tp-2: #f3ae7c;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #171a2b; --surface-2: #20243a; --ink: #eef2f6; --ink-2: #b6bfca; --muted: #8590a0;
  --line: #29313b; --line-strong: #3a4450; --accent: #6f9be8; --accent-ink: #0b1220; --accent-soft: #1d2a47;
  --example: #3a2f10; --example-ink: #f3d68a;
  --st-0: #1d6e52; --st-1: #2a9d74; --st-2: #5cc9a3; --st-3: #a8e6cf;
  --tm-0: #4f8fe0; --tm-1: #2a5288; --tm-2: #4a4d52; --tm-3: #8f3a3a; --tm-4: #e66767;
  --tp-0: #7a3a14; --tp-1: #cf6a30; --tp-2: #f3ae7c;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 14px/1.5 var(--font-body); margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---- top bar: brand white in both themes, shield stripes along the top ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--header-bg); color: var(--header-ink); border-bottom: 1px solid var(--header-line); }
.stripe { height: 5px; background: linear-gradient(90deg, var(--sm-orange) 0 20%, var(--sm-red) 20% 40%, var(--sm-navy) 40% 60%, var(--sm-blue) 60% 80%, var(--sm-green) 80% 100%); }
.top-inner { max-width: 1280px; margin: 0 auto; padding: 8px 16px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; }
.brand { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; min-width: 0; }
.brand .shield { width: 38px; height: auto; flex: none; }
.brand .wordmark { width: 140px; height: auto; flex: none; }
.brand .divider { width: 1px; height: 26px; background: var(--header-line); }
.brand h1 { font: italic 800 22px/1 var(--font-display); letter-spacing: .01em; text-transform: uppercase; margin: 0; color: var(--sm-navy); white-space: nowrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-left: auto; max-width: 100%; align-self: end; }
.tab { appearance: none; border: 0; background: none; padding: 10px 12px 11px; cursor: pointer; color: var(--header-muted); font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--header-ink); }
.tab[aria-selected="true"] { color: var(--header-ink); border-bottom-color: var(--sm-orange); }

main { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: grid; gap: 20px; }
.banner { background: var(--example); color: var(--example-ink); border-radius: var(--r); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.banner b { font-weight: 600; }

h2 { font: italic 800 24px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin: 0; text-wrap: balance; }
h3 { font: italic 700 18px/1.15 var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
.label { font: 500 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: var(--gap); }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: var(--gap); }

/* ---- controls ---- */
.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font: 500 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
input[type="text"], input[type="date"], input[type="number"], input[type="search"], select, textarea {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 9px; min-width: 0; width: 100%;
}
textarea { font: 12px/1.45 var(--font-mono); resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { appearance: none; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--critical); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.note { color: var(--ink-2); font-size: 13px; max-width: 72ch; }
.err { color: var(--critical); font-size: 13px; }
.ok { color: var(--good); font-size: 13px; }

/* ---- tiles & composition ---- */
.tile { display: grid; gap: 6px; align-content: start; }
.tile .big { font: italic 800 42px/1 var(--font-display); }
.tile .big small { font: 500 15px var(--font-body); color: var(--muted); margin-left: 4px; }
.tile .names { font-size: 12.5px; color: var(--ink-2); }
.comp { display: grid; gap: 10px; }
.comp-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; }
.stack { display: flex; height: 22px; gap: 2px; border-radius: 4px; overflow: hidden; }
.stack > div { min-width: 2px; display: grid; place-items: center; font: 600 11px/1 var(--font-body); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* ---- pills & flags ---- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); white-space: nowrap; }
.pill i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.flag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; color: var(--ink-2); }
.flag svg { flex: none; }
.flags { display: flex; flex-wrap: wrap; gap: 4px 10px; }

/* ---- table ---- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 500 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface); position: sticky; top: 0; }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--accent); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.click { cursor: pointer; }
tbody tr:last-child td { border-bottom: 0; }

/* ---- charts ---- */
.chart { width: 100%; min-height: 60px; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 11px var(--font-body); font-variant-numeric: tabular-nums; }
.chart .ylab { fill: var(--ink-2); font-size: 12px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .guide { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .guide-hot { stroke: var(--critical); stroke-width: 1.25; stroke-dasharray: 4 3; }
.chart .axis { stroke: var(--line-strong); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: var(--surface-2); }
.chart .gl { fill: var(--ink-2); font-size: 10.5px; }
.empty { color: var(--muted); font-size: 13px; padding: 18px 0; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 7px; padding: 7px 10px; font-size: 12px; line-height: 1.45; max-width: 260px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.tip b { font-weight: 600; }

/* ---- player view ---- */
.player-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.player-head h2 { font-size: 34px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2); font-size: 13px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; align-items: baseline; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.kv dd.big { font: 700 28px/1 var(--font-display); }
.meter { position: relative; height: 12px; border-radius: 6px; background: var(--surface-2); margin: 6px 0 18px; }
.meter .seg-b { position: absolute; top: 0; bottom: 0; }
.meter .mark { position: absolute; top: -4px; width: 3px; height: 20px; background: var(--ink); border-radius: 2px; transform: translateX(-1px); }
.meter .tick { position: absolute; top: 15px; font: 10.5px var(--font-mono); color: var(--muted); transform: translateX(-50%); }

.method { max-width: 78ch; display: grid; gap: 14px; }
.method p, .method li { color: var(--ink-2); }
.method h3 { margin-top: 8px; }
.method code { font: 12px var(--font-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }

@media (max-width: 640px) {
  .brand { flex-wrap: wrap; gap: 8px 10px; }
  .brand .wordmark { width: 112px; }
  .brand .divider { display: none; }
  .brand h1 { font-size: 17px; white-space: normal; flex-basis: 100%; }
  .brand .shield { width: 32px; }
  .tabs { margin-left: 0; }
  .player-head h2 { font-size: 28px; }
  .comp-row { grid-template-columns: 1fr; gap: 4px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
section.grid, div.grid { display: grid; }

.account { display: flex; gap: 10px; align-items: center; padding-bottom: 8px; }
.account:empty { display: none; }

.pcell { white-space: nowrap; }
.pbar { display: inline-block; width: 64px; height: 8px; border-radius: 4px; background: var(--surface-2); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

.gauge { display: grid; gap: 6px; align-content: start; }
.gauge .chart { min-height: 0; }
.gauge p.sub { margin: 0; line-height: 1.45; }
