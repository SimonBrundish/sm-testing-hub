    if (!window.supabase || !window.supabase.createClient) {
      store.mode = 'local'; store.error = 'The sign-in service did not load, so data is only being kept in this browser. Check your connection and reload.';
      const saved = readLocal(); S.players = saved && Array.isArray(saved.players) ? saved.players : []; render(); return;
    }
    // Invite and reset emails land here with #...&type=invite|recovery; the client reads and clears that hash, so check it first.
    const linkType = ((location.hash || '').match(/[#&]type=(\w+)/) || [])[1];
    if (linkType === 'invite' || linkType === 'recovery') S.recovery = linkType;
    const linkErr = ((location.hash || '').match(/error_description=([^&]+)/) || [])[1];
    if (linkErr) { S.msg = { login: decodeURIComponent(linkErr.replace(/\+/g, ' ')) + '. Use "Forgot your password?" below to get a fresh link.' }; history.replaceState(null, '', location.pathname + location.search); }
    const sb = store.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
    store.mode = 'supa';
    // Tables are prefixed so they can share a Supabase project with other apps.
    store.t = { players: cfg.playersTable || 'gm_players', settings: cfg.settingsTable || 'gm_settings', coaches: cfg.coachesTable || 'gm_coaches' };
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') S.recovery = S.recovery || 'recovery';
      const was = store.user && store.user.id;
      store.user = session ? session.user : null;
      if (store.user && store.user.id !== was) loadSupabase();
      if (!store.user) { S.players = []; S.loaded = false; S.notCoach = false; if (store.channel) { sb.removeChannel(store.channel); store.channel = null; } render(); }
    });
    const { data } = await sb.auth.getSession();
    store.user = data && data.session ? data.session.user : null;
    if (store.user) await loadSupabase(); else render();
  }
  async function loadSupabase() {
    const sb = store.sb, t = store.t;
    // Signed in is not enough: the account must also be on the coach list.
    const me = await sb.from(t.coaches).select('email').limit(1);
    S.notCoach = !me.error && !(me.data && me.data.length);
    if (me.error) store.error = 'Your coach access could not be checked: ' + me.error.message;
    if (S.notCoach) { S.players = []; S.loaded = true; render(); return; }
    const [pl, st] = await Promise.all([sb.from(t.players).select('id,data'), sb.from(t.settings).select('data').eq('id', 'settings').maybeSingle()]);
    if (pl.error) store.error = 'Players could not be loaded: ' + pl.error.message;
    else S.players = pl.data.map(r => ({ ...r.data, id: r.id, assessments: ((r.data && r.data.assessments) || []).slice() }));
    if (st && st.data && st.data.data) S.settings = { ...G.DEFAULT_SETTINGS, ...st.data.data };
    S.loaded = true; invalidate(); renderSoft();
    if (!store.channel) {
      store.channel = sb.channel('gm-players').on('postgres_changes', { event: '*', schema: 'public', table: t.players }, ev => {
        if (ev.eventType === 'DELETE') S.players = S.players.filter(p => p.id !== (ev.old && ev.old.id));
        else if (ev.new && ev.new.id) {
          const np = { ...ev.new.data, id: ev.new.id, assessments: ((ev.new.data && ev.new.data.assessments) || []).slice() };
          const i = S.players.findIndex(p => p.id === np.id);
          if (i >= 0) S.players[i] = np; else S.players.push(np);
        }
        invalidate(); renderSoft();
      }).subscribe();
    }
  }
  async function supaWrite(changed, removed) {
    const sb = store.sb, t = store.t, now = new Date().toISOString();
    if (changed.length) { const { error } = await sb.from(t.players).upsert(changed.map(p => ({ id: p.id, data: cleanPlayer(p), updated_at: now }))); if (error) throw { supa: error }; }
    if (removed.length) { const { error } = await sb.from(t.players).delete().in('id', removed); if (error) throw { supa: error }; }
  }
  function viewLogin() {
    if (store.user && S.notCoach) return `<section class="panel" style="max-width:420px;margin:24px auto;width:100%"><h2>Not on the coach list</h2>
      <p class="sub" style="margin-top:4px">You are signed in as ${esc(store.user.email || '')}, but this account has not been given access to player data. Ask the academy to add you as a coach.</p>
      <button class="btn" id="sign-out" style="margin-top:14px">Sign out</button></section>`;
    if (S.recovery && store.user) return `<section class="panel" style="max-width:420px;margin:24px auto;width:100%"><h2>${S.recovery === 'invite' ? 'Welcome, choose your password' : 'Choose a new password'}</h2>
      <p class="sub" style="margin-top:4px">For ${esc(store.user.email || '')}. Use at least 8 characters.</p>
      <form id="newpw" style="display:grid;gap:12px;margin-top:14px"><label class="field"><span>New password</span><input type="password" id="np-pw" minlength="8" autocomplete="new-password" required></label>
      <button class="btn primary" type="submit">Save password</button><p class="err" role="status">${esc(S.msg.login || '')}</p></form></section>`;
    return `<section class="panel" style="max-width:420px;margin:24px auto;width:100%"><h2>Coach sign-in</h2>
      <p class="sub" style="margin-top:4px">Player growth data is private. Sign in with the account your academy set up for you.</p>
      <form id="login" style="display:grid;gap:12px;margin-top:14px">
        <label class="field"><span>Email</span><input type="email" id="lg-email" autocomplete="username" required value="${esc(S.loginEmail || '')}"></label>
        <label class="field"><span>Password</span><input type="password" id="lg-pw" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Sign in</button>
        <button class="linkish" type="button" id="lg-forgot" style="justify-self:start">Forgot your password?</button>
        <p class="${S.msg.loginOk ? 'ok' : 'err'}" role="status">${esc(S.msg.login || '')}</p></form>
      <p class="sub" style="margin-top:8px">The calculator and method pages work without signing in.</p></section>`;
  }

  function storeError(e) {
    if (e && e.supa) { store.error = 'This change was not saved: ' + (e.supa.message || 'the database refused it') + '. Try again, or sign in again if it keeps happening.'; renderSoft(); return; }
    const code = e && e.code;
    store.error = code === 'invalid_argument' ? 'This change was not saved. You may only have view access to this dashboard; ask its owner for edit access.'
      : code === 'quota_exceeded' ? 'The dashboard storage is full. Remove old players or measurements, then try again.'
      : 'This change was not saved because the connection dropped. Try again.';
    renderSoft();
  }
  // Save changed players and delete removed ones, then redraw.
  async function persist(changed = [], removed = []) {
    invalidate(); render();
    if (store.mode === 'supa') { store.error = ''; try { await supaWrite(changed, removed); return true; } catch (e) { storeError(e); return false; } }
    if (store.mode !== 'db') { saveLocal(); return true; }
    store.error = '';
    try {
      for (const p of changed) await store.db.doc('players/' + p.id).set(cleanPlayer(p));
      for (const id of removed) await store.db.doc('players/' + id).delete();
      return true;
    } catch (e) { storeError(e); return false; }
  }
  async function persistSettings() {
    invalidate(); render();
    if (store.mode === 'supa') { const { error } = await store.sb.from(store.t.settings).upsert({ id: 'settings', data: { ...S.settings }, updated_at: new Date().toISOString() }); if (error) storeError({ supa: error }); return; }
    if (store.mode !== 'db') { saveLocal(); return; }
    try { await store.db.doc('config/settings').set({ ...S.settings }); } catch (e) { storeError(e); }
  }
  // Re-render on live data without wiping something the viewer is typing.
  let pendingRender = false;
  function renderSoft() {
    const a = document.activeElement;
    if (a && a.closest && a.closest('#view') && a.matches('input:not([type=checkbox]):not([type=file]), textarea')) { pendingRender = true; return; }
    render();
  }
  document.addEventListener('focusout', () => setTimeout(() => {
    const a = document.activeElement;
    if (pendingRender && !(a && a.matches && a.matches('#view input, #view textarea'))) { pendingRender = false; render(); }
  }, 0));
  const uniqueKey = p => p.name.trim().toLowerCase() + '|' + p.dob;
  function mergePlayers(incoming, replace) {
    const changed = [], removed = [];
    if (replace) { removed.push(...S.players.map(p => p.id)); S.players = []; }
    for (const np of incoming) {
      const ex = S.players.find(x => uniqueKey(x) === uniqueKey(np));
      if (ex) {
        for (const a of np.assessments) ex.assessments = ex.assessments.filter(b => b.date !== a.date).concat(a);
        for (const t of np.tests || []) ex.tests = (ex.tests || []).filter(b => b.date !== t.date).concat(t);
        ex.mother = ex.mother || np.mother; ex.father = ex.father || np.father; ex.squad = ex.squad || np.squad;
        changed.push(ex);
      } else { S.players.push(np); changed.push(np); }
    }
    const keep = new Set(changed.map(p => p.id));
    return { changed, removed: removed.filter(id => !keep.has(id)) };
  }

  let _prof = null, _recs = null;
  const invalidate = () => { _prof = null; _recs = null; };
  const records = () => _recs || (_recs = G.testRecords(profiles(), S.settings));
  const metricOf = k => G.METRICS.find(m => m.key === k) || G.METRICS[0];
  function profiles() {
    if (!_prof) _prof = S.players.map(p => G.profile(p, S.settings));
    return _prof;
  }
  function filtered() {
    const q = S.filter.q.trim().toLowerCase();
    return profiles().filter(p =>
      (S.filter.squad === 'all' || (p.squad || 'No squad') === S.filter.squad) &&
      (S.filter.sex === 'all' || p.sex === S.filter.sex) &&
      (!q || p.name.toLowerCase().includes(q)));
  }
  const squads = () => [...new Set(S.players.map(p => p.squad || 'No squad'))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

  // ---------- small renderers ----------
  const pill = (label, color) => label ? `<span class="pill"><i style="background:${color}"></i>${esc(label)}</span>` : '<span class="muted">—</span>';
  const statusPill = l => l && l.status ? pill(l.status, STATUS_COL[l.statusIdx]) : '—';
  const timingPill = l => l && l.timing ? pill(l.timing, TIMING_COL[l.timingIdx]) : '—';
  const tempoPill = (t, i) => t ? pill(t, TEMPO_COL[i]) : '—';
  const flagIcon = lvl => lvl === 'info'
    ? `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="${LEVEL_COL.info}" stroke-width="1.5"/><path d="M6 3.5v3.2M6 8.4v.1" stroke="${LEVEL_COL.info}" stroke-width="1.5" stroke-linecap="round"/></svg>`
    : `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1 11.2 10.5H.8Z" fill="${LEVEL_COL[lvl]}"/><path d="M6 4.6v2.6M6 8.7v.1" stroke="var(--surface)" stroke-width="1.4" stroke-linecap="round"/></svg>`;
  const flagsHTML = flags => flags.length ? `<div class="flags">${flags.map(x => `<span class="flag">${flagIcon(x.level)}${esc(x.label)}</span>`).join('')}</div>` : '';

  // ---------- tooltip ----------
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
  document.addEventListener('pointermove', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    tip.innerHTML = t.getAttribute('data-tip');
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  });
  document.addEventListener('pointerleave', () => { tip.hidden = true; });
  const tipAttr = html => `data-tip="${esc(html)}"`;

  // ---------- charts ----------
  const CHARTS = new Map();
  function chartSlot(id, fn) { CHARTS.set(id, fn); return `<div class="chart" id="ch-${id}"></div>`; }
  function drawCharts() {
    for (const [id, fn] of CHARTS) {
      const el = document.getElementById('ch-' + id);
      if (el) el.innerHTML = fn(Math.max(280, el.clientWidth));
    }
  }
  function niceTicks(lo, hi, n = 5) {
    const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }

  // One row per player, shared x scale.
  function rowChart(W, { rows, domain, ticks, guides = [], mark, tickFmt = v => v, emptyText }) {
    if (!rows.length) return `<div class="empty">${esc(emptyText || 'No players to show.')}</div>`;
    const labelW = Math.min(150, Math.max(96, W * 0.28)), top = guides.some(g => g.label) ? 20 : 6, rowH = 22, bottom = 22, right = 14;
    const H = top + rows.length * rowH + bottom;
    const x = v => labelW + (Math.max(domain[0], Math.min(domain[1], v)) - domain[0]) / (domain[1] - domain[0]) * (W - labelW - right);
    let s = `<svg width="${W}" height="${H}" role="img">`;
    for (const t of ticks) s += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - bottom}"/><text x="${x(t)}" y="${H - 6}" text-anchor="middle">${tickFmt(t)}</text>`;
    for (const g of guides) {
      s += `<line class="${g.hot ? 'guide-hot' : 'guide'}" x1="${x(g.v)}" x2="${x(g.v)}" y1="${top - 4}" y2="${H - bottom}"/>`;
      if (g.label) s += `<text class="gl" x="${x(g.v)}" y="${top - 8}" text-anchor="${g.anchor || 'middle'}">${esc(g.label)}</text>`;
    }
    rows.forEach((r, i) => {
      const y = top + i * rowH, mid = y + rowH / 2;
      s += `<g ${tipAttr(r.tip)} data-pid="${esc(r.id)}" style="cursor:pointer"><rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}"/>`;
      s += `<text class="ylab" x="${labelW - 8}" y="${mid + 4}" text-anchor="end">${esc(trunc(r.label, labelW))}</text>`;
      s += mark(r, x, mid, rowH) + '</g>';
    });
    return s + '</svg>';
  }
  const trunc = (s, w) => { const max = Math.floor((w - 12) / 6.4); return s.length > max ? s.slice(0, max - 1) + '…' : s; };
  const bar = (x0, x1, mid, h, fill) => { const a = Math.min(x0, x1), w = Math.max(2, Math.abs(x1 - x0)); return `<rect x="${a}" y="${mid - h / 2}" width="${w}" height="${h}" rx="3" fill="${fill}"/>`; };

  // Time series with one y scale.
  function timeChart(W, { series = [], band, yBands = [], yDomain, guides = [], yFmt = v => v, H = 230, emptyText }) {
    const pts = series.flatMap(s => s.points);
    if (!pts.length) return `<div class="empty">${esc(emptyText || 'Not enough measurements yet.')}</div>`;
    const ts = pts.map(p => p.t).concat(band ? band.map(b => b.t) : []);
    let t0 = Math.min(...ts), t1 = Math.max(...ts);
    if (t1 - t0 < 30 * 864e5) { t0 -= 30 * 864e5; t1 += 30 * 864e5; }
    const left = 44, right = 16, top = 12, bottom = 26;
    const [y0, y1] = yDomain;
    const x = t => left + (t - t0) / (t1 - t0) * (W - left - right);
    const y = v => top + (1 - (v - y0) / (y1 - y0)) * (H - top - bottom);
    let s = `<svg width="${W}" height="${H}" role="img">`;
    for (const b of yBands) s += `<rect x="${left}" width="${W - left - right}" y="${y(Math.min(b.to, y1))}" height="${Math.max(0, y(Math.max(b.from, y0)) - y(Math.min(b.to, y1)))}" fill="${b.color}" opacity=".18"/>`;
    for (const v of niceTicks(y0, y1, 5)) s += `<line class="grid" x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}"/><text x="${left - 6}" y="${y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`;
    // x ticks: months
    const months = []; const d = new Date(t0); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + 1);
    while (d.getTime() <= t1) { months.push(d.getTime()); d.setUTCMonth(d.getUTCMonth() + 1); }
    const every = Math.max(1, Math.ceil(months.length / Math.max(2, Math.floor((W - 60) / 70))));
    months.forEach((m, i) => { if (i % every === 0) s += `<text x="${x(m)}" y="${H - 8}" text-anchor="middle">${new Date(m).toLocaleDateString('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' })}</text>`; });
    s += `<line class="axis" x1="${left}" x2="${W - right}" y1="${H - bottom}" y2="${H - bottom}"/>`;
    for (const g of guides) s += `<line class="${g.hot ? 'guide-hot' : 'guide'}" x1="${left}" x2="${W - right}" y1="${y(g.v)}" y2="${y(g.v)}"/>${g.label ? `<text class="gl" x="${W - right}" y="${y(g.v) - 4}" text-anchor="end">${esc(g.label)}</text>` : ''}`;
    if (band && band.length) {
      const up = band.map(b => `${x(b.t)},${y(b.hi)}`), dn = band.slice().reverse().map(b => `${x(b.t)},${y(b.lo)}`);
      s += `<polygon points="${up.concat(dn).join(' ')}" fill="${band[0].color}" opacity=".16"/>`;
    }
    for (const se of series) {
      if (se.points.length > 1) s += `<polyline points="${se.points.map(p => `${x(p.t)},${y(p.v)}`).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" ${se.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
      for (const p of se.points) s += `<g ${tipAttr(p.tip || '')}><circle cx="${x(p.t)}" cy="${y(p.v)}" r="10" fill="transparent"/><circle cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/></g>`;
    }
    return s + '</svg>';
  }

  // Columns per measurement interval.
  function intervalChart(W, { items, unit, guide, color, H = 200, emptyText }) {
    if (!items.length) return `<div class="empty">${esc(emptyText)}</div>`;
    const left = 44, right = 16, top = 14, bottom = 26;
    const vals = items.map(i => i.v);
    const y0 = Math.min(0, ...vals), y1 = Math.max(guide ? guide.v * 1.15 : 1, ...vals) * 1.08;
    const y = v => top + (1 - (v - y0) / (y1 - y0)) * (H - top - bottom);
    const step = (W - left - right) / items.length, bw = Math.min(46, step * 0.6);
    let s = `<svg width="${W}" height="${H}" role="img">`;
    for (const v of niceTicks(y0, y1, 4)) s += `<line class="grid" x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}"/><text x="${left - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    if (guide) s += `<line class="guide-hot" x1="${left}" x2="${W - right}" y1="${y(guide.v)}" y2="${y(guide.v)}"/><text class="gl" x="${W - right}" y="${y(guide.v) - 4}" text-anchor="end">${esc(guide.label)}</text>`;
    const every = Math.max(1, Math.ceil(items.length / Math.max(2, Math.floor((W - 60) / 64))));
    items.forEach((it, i) => {
      const cx = left + step * (i + 0.5), ya = y(Math.max(0, it.v)), yb = y(Math.min(0, it.v));
      s += `<g ${tipAttr(it.tip)}><rect x="${cx - step / 2}" y="${top}" width="${step}" height="${H - top - bottom}" fill="transparent"/>`;
      s += `<rect x="${cx - bw / 2}" y="${ya}" width="${bw}" height="${Math.max(2, yb - ya)}" rx="3" fill="${it.color || color}"/></g>`;
      if (i % every === 0) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(it.label)}</text>`;
    });
    s += `<line class="axis" x1="${left}" x2="${W - right}" y1="${y(0)}" y2="${y(0)}"/>`;
    return s + '</svg>';
  }

  const legend = (labels, cols) => `<div class="legend">${labels.map((l, i) => `<span><i style="background:${cols[i]}"></i>${esc(l)}</span>`).join('')}</div>`;

  // ---------- views ----------
  // x/y scatter with optional highlighted points.
  function scatterChart(W, { points, xDomain, yDomain, xLabel, yFmt = v => v, H = 300, emptyText }) {
    if (!points.length) return `<div class="empty">${esc(emptyText || 'No test results to show.')}</div>`;
    const left = 52, right = 14, top = 12, bottom = 40;
    const x = v => left + (v - xDomain[0]) / (xDomain[1] - xDomain[0]) * (W - left - right);
    const y = v => top + (1 - (v - yDomain[0]) / (yDomain[1] - yDomain[0])) * (H - top - bottom);
    let s = `<svg width="${W}" height="${H}" role="img">`;
    for (const v of niceTicks(yDomain[0], yDomain[1], 5)) s += `<line class="grid" x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}"/><text x="${left - 6}" y="${y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`;
    for (const v of niceTicks(xDomain[0], xDomain[1], Math.max(3, Math.floor((W - 80) / 70)))) s += `<line class="grid" x1="${x(v)}" x2="${x(v)}" y1="${top}" y2="${H - bottom}"/><text x="${x(v)}" y="${H - bottom + 16}" text-anchor="middle">${v}</text>`;
    s += `<text class="gl" x="${(left + W - right) / 2}" y="${H - 4}" text-anchor="middle">${esc(xLabel)}</text>`;
    for (const p of points.filter(p => !p.hot)) s += `<circle cx="${x(p.x)}" cy="${y(p.y)}" r="2.6" fill="var(--line-strong)" opacity=".45"/>`;
    for (const p of points.filter(p => p.hot)) s += `<g ${tipAttr(p.tip)} data-pid="${esc(p.id)}" style="cursor:pointer"><circle cx="${x(p.x)}" cy="${y(p.y)}" r="11" fill="transparent"/><circle cx="${x(p.x)}" cy="${y(p.y)}" r="5.5" fill="${p.color}" stroke="var(--ink)" stroke-width="1.2"/></g>`;
    return s + '</svg>';
  }
  const pctTxt = r => r && r.pct != null ? (r.pct < 1 ? '<1' : r.pct > 99 ? '>99' : Math.round(r.pct)) : '—';
  const pctBar = r => r && r.pct != null ? `<span class="pbar" ${tipAttr(`Better than about ${pctTxt(r)}% of players at that age<br>Compared with ${r.tests} tests from ${r.players} other players`)}><i style="width:${Math.max(2, r.pct)}%"></i></span><span class="num">${pctTxt(r)}</span>` : `<span class="sub" ${r ? tipAttr(`Not enough comparison data yet (${r.players} other player${r.players === 1 ? '' : 's'})`) : ''}>—</span>`;
  const fmtVal = (m, v) => typeof v === 'number' ? v.toFixed(m.d) + (m.unit ? ' ' + m.unit : '') : '—';
  const metricSelect = () => `<label class="field" style="width:230px"><span>Test</span><select id="pm-metric">${[...new Set(G.METRICS.map(m => m.cat))].map(c => `<optgroup label="${esc(c)}">${G.METRICS.filter(m => m.cat === c).map(m => `<option value="${m.key}" ${S.metric === m.key ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}</optgroup>`).join('')}</select></label>`;
  // Latest result per player for a metric, with both percentiles.
  function latestScores(list, m) {
    const R = records(), out = [];
    for (const p of list) {
      const mine = R.filter(r => r.pid === p.id && typeof r.vals[m.key] === 'number').sort((a, b) => b.t - a.t);
      if (!mine.length) continue;
      const r = mine[0];
      out.push({ p, r, age: G.percentileAmong(R, r, m, 'ca'), mat: G.percentileAmong(R, r, m, 'ba') });
    }
    return out;
  }

  function viewPerf() {
    const R = records();
    if (!R.length) return `<section class="panel"><h2>No test results yet</h2><p class="note" style="margin-top:8px">Import Testing Hub results on the Data tab: either its data.json file or a spreadsheet with name, test date and a column per test. Results are matched to players by name.</p>
      <div class="bar" style="margin-top:14px"><button class="btn primary tab-link" data-goto="data">Import test results</button></div></section>`;
    const m = metricOf(S.metric);
    const list = filtered();
    const rows = latestScores(list, m);
    const both = rows.filter(x => x.age && x.age.pct != null && x.mat && x.mat.pct != null);
    const bar = `<div class="bar">${metricSelect()}
        <label class="field" style="width:150px"><span>Squad</span>
          <select id="f-squad"><option value="all">All squads</option>${squads().map(s => `<option ${S.filter.squad === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
        <div class="field"><span>Sex</span><div class="seg" role="group" aria-label="Sex">
          ${[['all', 'All'], ['M', 'Boys'], ['F', 'Girls']].map(([v, l]) => `<button data-sex="${v}" aria-pressed="${S.filter.sex === v}">${l}</button>`).join('')}</div></div>
        <span class="sub" style="margin-left:auto">${rows.length} player${rows.length === 1 ? '' : 's'} with a ${esc(m.label)} result${m.lower ? ' · lower is better' : ''}</span></div>`;
    const tipFor = x => `<b>${esc(x.p.name)}</b> · ${fmtDate(x.r.date)}<br>${esc(m.label)} ${fmtVal(m, x.r.vals[m.key])}<br>Age ${f(x.r.ca, 1)} · biological age ${f(x.r.ba, 1)} (${sgn(x.r.baDiff, 1)})<br>By age: ${pctTxt(x.age)} · by maturity: ${pctTxt(x.mat)}`;
    const shift = x => x.mat.pct - x.age.pct;
    const c1 = chartSlot('perf-shift', W => rowChart(W, {
      rows: both.slice().sort((a, b) => shift(b) - shift(a)).map(x => ({ id: x.p.id, label: x.p.name, tip: tipFor(x), x })),
      domain: [0, 100], ticks: [0, 25, 50, 75, 100], guides: [{ v: 50, label: W < 520 ? '' : 'Average' }],
      mark: (r, X, mid) => { const a = X(r.x.age.pct), b = X(r.x.mat.pct), col = r.x.r.timingIdx != null ? TIMING_COL[r.x.r.timingIdx] : 'var(--muted)';
        return `<line x1="${a}" x2="${b}" y1="${mid}" y2="${mid}" stroke="var(--line-strong)" stroke-width="2"/><circle cx="${a}" cy="${mid}" r="4.5" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${b}" cy="${mid}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="1.5"/>`; },
      emptyText: 'Percentiles need results from at least four other players of the same sex at a similar age.'
    }));
    const axis = S.paxis === 'ca' ? 'ca' : 'ba';
    const pool = R.filter(r => typeof r.vals[m.key] === 'number' && r[axis] != null && (S.filter.sex === 'all' || r.sex === S.filter.sex));
    const xs = pool.map(r => r[axis]), ys = pool.map(r => r.vals[m.key]);
    const pad = (lo, hi) => { const d = (hi - lo) * 0.06 || 1; return [lo - d, hi + d]; };
    const c2 = chartSlot('perf-scatter', W => scatterChart(W, {
      points: pool.map(r => ({ x: r[axis], y: r.vals[m.key] })).concat(rows.filter(x => x.r[axis] != null).map(x => ({ x: x.r[axis], y: x.r.vals[m.key], hot: true, id: x.p.id, tip: tipFor(x), color: x.r.timingIdx != null ? TIMING_COL[x.r.timingIdx] : 'var(--muted)' }))),
      xDomain: xs.length ? [Math.floor(Math.min(...xs)), Math.ceil(Math.max(...xs))] : [8, 16], yDomain: ys.length ? pad(Math.min(...ys), Math.max(...ys)) : [0, 1],
      xLabel: axis === 'ba' ? 'Biological age (years)' : 'Chronological age (years)', yFmt: v => +v.toFixed(Math.max(0, m.d - 1))
    }));
    const tbl = rows.slice().sort((a, b) => (b.mat?.pct ?? -1) - (a.mat?.pct ?? -1)).map(x => `<tr class="click" data-pid="${esc(x.p.id)}" tabindex="0"><td><b>${esc(x.p.name)}</b></td><td>${esc(x.p.squad || '—')}</td><td>${fmtDate(x.r.date)}</td><td class="n">${f(x.r.ca, 1)}</td><td class="n">${f(x.r.ba, 1)}</td><td>${timingPill(x.r.timing != null ? x.r : (x.r.timingIdx != null ? { timing: G.TIMING[x.r.timingIdx], timingIdx: x.r.timingIdx } : null))}</td><td>${x.r.statusIdx != null ? pill(G.STATUS[x.r.statusIdx], STATUS_COL[x.r.statusIdx]) : '—'}</td><td class="n">${fmtVal(m, x.r.vals[m.key])}</td><td class="pcell">${pctBar(x.age)}</td><td class="pcell">${pctBar(x.mat)}</td><td class="n">${x.age?.pct != null && x.mat?.pct != null ? sgn(Math.round(x.mat.pct) - Math.round(x.age.pct), 0) : '—'}</td></tr>`).join('');
    const noMat = rows.filter(x => x.r.ba == null);
    return bar + `<div class="grid2">
      <section class="panel"><div class="panel-head"><div><h3>Compared by age, then by maturity</h3><p class="sub">${esc(m.label)} percentile (100 = best): hollow dot against players the same age, filled dot against players at the same stage of growth</p></div>${legend(G.TIMING, TIMING_COL)}</div>${c1}</section>
      <section class="panel"><div class="panel-head"><div><h3>${esc(m.label)} by ${axis === 'ba' ? 'biological' : 'chronological'} age</h3><p class="sub">Every test (grey) with each player's latest result coloured by maturity timing${m.lower ? '. Lower is better.' : ''}</p></div>
        <div class="seg" role="group" aria-label="Age axis"><button data-paxis="ca" aria-pressed="${axis === 'ca'}">Age</button><button data-paxis="ba" aria-pressed="${axis === 'ba'}">Biological age</button></div></div>${c2}</section></div>
      <section class="grid" style="gap:10px"><div class="panel-head" style="margin:0"><h3>Latest ${esc(m.label)} results</h3><span class="sub">Early maturers usually drop when judged by maturity; late developers usually rise.</span></div>
      <div class="table-wrap"><table><thead><tr><th>Player</th><th>Squad</th><th>Tested</th><th class="n">Age</th><th class="n">Bio age</th><th>Timing</th><th>Status</th><th class="n">Result</th><th>By age</th><th>By maturity</th><th class="n">Change</th></tr></thead>
      <tbody>${tbl || `<tr><td colspan="11" class="empty">No ${esc(m.label)} results for these players.</td></tr>`}</tbody></table></div>
      ${noMat.length ? `<p class="sub">No maturity estimate on the test date for ${noMat.map(x => esc(x.p.name)).join(', ')}. They need parents' heights and a height and weight measured within a few months of the test.</p>` : ''}</section>`;
  }

  // Player page: one row per test with both percentiles for the latest result.
  function playerPerf(p) {
    const R = records(), mine = R.filter(r => r.pid === p.id).sort((a, b) => b.t - a.t);
    if (!mine.length) return '';
    const rows = G.METRICS.map(m => {
      const r = mine.find(x => typeof x.vals[m.key] === 'number'); if (!r) return '';
      const a = G.percentileAmong(R, r, m, 'ca'), b = G.percentileAmong(R, r, m, 'ba');
      return `<tr><td><b>${esc(m.label)}</b> <span class="sub">${esc(m.cat)}</span></td><td>${fmtDate(r.date)}</td><td class="n">${fmtVal(m, r.vals[m.key])}</td><td class="pcell">${pctBar(a)}</td><td class="pcell">${pctBar(b)}</td><td class="n">${a?.pct != null && b?.pct != null ? sgn(Math.round(b.pct) - Math.round(a.pct), 0) : '—'}</td></tr>`;
    }).join('');
    const conf = S.confirm;
    const hist = mine.map(r => { const k = 'del-t:' + r.date;
      return `<tr><td>${fmtDate(r.date)}</td><td class="n">${f(r.ca, 1)}</td><td class="n">${f(r.ba, 1)}</td>${G.METRICS.map(m => `<td class="n">${typeof r.vals[m.key] === 'number' ? r.vals[m.key].toFixed(m.d) : '—'}</td>`).join('')}
        <td>${conf === k ? `<span class="confirm"><button class="btn small danger" data-del-t="${esc(r.date)}">Delete</button><button class="btn small" data-cancel>Keep</button></span>` : `<button class="btn small" data-ask="${esc(k)}">Remove</button>`}</td></tr>`; }).join('');
    return `<section class="panel"><div class="panel-head"><div><h3>Performance tests</h3><p class="sub">Latest result for each test. Percentile 100 = best, against players the same age and against players at the same stage of growth.</p></div><button class="btn small tab-link" data-goto="perf">Squad view</button></div>
      <div class="table-wrap"><table><thead><tr><th>Test</th><th>Tested</th><th class="n">Result</th><th>By age</th><th>By maturity</th><th class="n">Change</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      <section class="grid" style="gap:10px"><h3>Test history</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th class="n">Age</th><th class="n">Bio age</th>${G.METRICS.map(m => `<th class="n">${esc(m.label)}${m.unit ? ` <span class="sub">${esc(m.unit)}</span>` : ''}</th>`).join('')}<th></th></tr></thead><tbody>${hist}</tbody></table></div></section>`;
  }

  function viewSquad() {
    if (!S.players.length) return `<section class="panel"><h2>No players yet</h2><p class="note" style="margin-top:8px">Import your existing measurements from Excel or CSV on the Data tab, or add players and record a testing session on the Record tab.</p>
      <div class="bar" style="margin-top:14px"><button class="btn primary tab-link" data-goto="data">Import a spreadsheet</button><button class="btn tab-link" data-goto="record">Record a session</button></div></section>`;
    const list = filtered();
    const withData = list.filter(p => p.latest && p.latest.pah);
    const st = S.settings;
    const fsel = `
      <div class="bar">
        <label class="field" style="width:150px"><span>Squad</span>
          <select id="f-squad"><option value="all">All squads</option>${squads().map(s => `<option ${S.filter.squad === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
        <div class="field"><span>Sex</span><div class="seg" role="group" aria-label="Sex">
          ${[['all', 'All'], ['M', 'Boys'], ['F', 'Girls']].map(([v, l]) => `<button data-sex="${v}" aria-pressed="${S.filter.sex === v}">${l}</button>`).join('')}</div></div>
        <label class="field" style="flex:1;min-width:160px;max-width:280px"><span>Find a player</span><input type="search" id="f-q" placeholder="Name" value="${esc(S.filter.q)}"></label>
        <span class="sub" style="margin-left:auto">${list.length} player${list.length === 1 ? '' : 's'} · ${withData.length} with a prediction</span>
      </div>`;

    const growth = list.filter(p => p.flags.some(x => x.key === 'growth'));
    const circa = withData.filter(p => p.latest.statusIdx === 2);
    const offTime = withData.filter(p => p.latest.timingIdx === 0 || p.latest.timingIdx === 4);
    const stale = list.filter(p => p.flags.some(x => x.key === 'stale'));
    const names = arr => arr.length ? arr.slice(0, 6).map(p => esc(p.name.split(' ')[0])).join(', ') + (arr.length > 6 ? ` +${arr.length - 6}` : '') : 'None';
    const tile = (label, n, sub, who) => `<div class="panel tile"><span class="label">${label}</span><div class="big num">${n}<small>${sub}</small></div><div class="names">${who}</div></div>`;
    const tiles = `<div class="grid4">
      ${tile('Rapid growth', growth.length, `≥ ${st.heightTempo[1]} cm/yr`, names(growth))}
      ${tile('Circa-PHV', circa.length, `${st.statusCuts[1]}–${st.statusCuts[2]}% PAH`, names(circa))}
      ${tile('Early or late', offTime.length, `BA−CA beyond ±${st.timingCuts[1]} yr`, names(offTime))}
      ${tile('Due a re-measure', stale.length, `> ${st.staleDays} days`, names(stale))}
    </div>`;

    const compRow = (label, labels, cols, counts) => {
      const total = counts.reduce((a, b) => a + b, 0);
      if (!total) return `<div class="comp-row"><span class="label">${label}</span><span class="sub">No data</span></div>`;
      return `<div class="comp-row"><span class="label">${label}</span><div style="display:grid;gap:6px"><div class="stack">${counts.map((c, i) => c ? `<div style="flex:${c};background:${cols[i]}" ${tipAttr(`<b>${esc(labels[i])}</b><br>${c} player${c === 1 ? '' : 's'} (${Math.round(100 * c / total)}%)`)}></div>` : '').join('')}</div>${legend(labels.map((l, i) => `${l} ${counts[i]}`), cols)}</div></div>`;
    };
    const cnt = (arr, key, n) => { const c = Array(n).fill(0); arr.forEach(p => { const v = key(p); if (v != null) c[v]++; }); return c; };
    const comp = `<section class="panel"><div class="panel-head"><h3>Squad breakdown</h3><span class="sub">Latest assessment per player</span></div><div class="comp">
      ${compRow('Maturity status', G.STATUS, STATUS_COL, cnt(withData, p => p.latest.statusIdx, 4))}
      ${compRow('Maturity timing', G.TIMING, TIMING_COL, cnt(withData, p => p.latest.timingIdx, 5))}
      ${compRow('Height tempo', G.TEMPO, TEMPO_COL, cnt(list, p => p.heightTempoIdx, 3))}
      ${compRow('Mass tempo', G.TEMPO, TEMPO_COL, cnt(list, p => p.weightTempoIdx, 3))}
    </div></section>`;

    const tipFor = p => {
      const l = p.latest;
      return `<b>${esc(p.name)}</b> · ${esc(p.squad || '')}<br>${fmtDate(l.date)}<br>Height ${f(l.height)} cm · PAH ${f(l.pah)} cm<br>${f(l.pct)}% PAH · ${esc(l.status || '')}<br>BA ${f(l.ba, 2)} · CA ${f(l.age, 2)} (${sgn(l.baDiff)}) · ${esc(l.timing || '')}` +
        (p.hv != null ? `<br>Growth ${f(p.hv)} cm/yr · ${f(p.wv)} kg/yr` : '');
    };
    const rowsBy = (arr, key, dir = -1) => arr.slice().sort((a, b) => dir * (key(a) - key(b)));

    const pctRows = rowsBy(withData, p => p.latest.pct).map(p => ({ id: p.id, label: p.name, tip: tipFor(p), p }));
    const pctMin = Math.min(70, ...withData.map(p => Math.floor(p.latest.pct / 5) * 5));
    const c1 = chartSlot('pct', W => rowChart(W, {
      rows: pctRows, domain: [pctMin, 100], ticks: niceTicks(pctMin, 100, 6), tickFmt: v => v + '%',
      guides: st.statusCuts.map((v, i) => ({ v, label: W < 640 ? '' : ['Approaching', 'Circa', 'Post'][i] })),
      mark: (r, x, mid) => bar(x(pctMin), x(r.p.latest.pct), mid, 12, STATUS_COL[r.p.latest.statusIdx]) + `<text x="${x(r.p.latest.pct) + 5}" y="${mid + 4}">${f(r.p.latest.pct)}</text>`,
      emptyText: 'No predictions yet. Players need parent heights, height and mass.'
    }));

    const diffRows = rowsBy(withData, p => p.latest.baDiff).map(p => ({ id: p.id, label: p.name, tip: tipFor(p), p }));
    const dmax = Math.max(2, Math.ceil(Math.max(...withData.map(p => Math.abs(p.latest.baDiff)), 0)));
    const c2 = chartSlot('timing', W => rowChart(W, {
      rows: diffRows, domain: [-dmax, dmax], ticks: niceTicks(-dmax, dmax, 6), tickFmt: v => (v > 0 ? '+' : '') + v,
      guides: [{ v: 0 }, { v: -st.timingCuts[1], label: 'Late' }, { v: st.timingCuts[1], label: 'Early' }],
      mark: (r, x, mid) => bar(x(0), x(r.p.latest.baDiff), mid, 12, TIMING_COL[r.p.latest.timingIdx]),
    }));

    const hRows = rowsBy(withData, p => p.latest.pah).map(p => ({ id: p.id, label: p.name, tip: tipFor(p) + `<br>50%: ${f(p.latest.ci50[0])}–${f(p.latest.ci50[1])} cm<br>90%: ${f(p.latest.ci90[0])}–${f(p.latest.ci90[1])} cm`, p }));
    const hLo = Math.floor(Math.min(...withData.map(p => p.latest.height), 200) / 10) * 10, hHi = Math.ceil(Math.max(...withData.map(p => p.latest.ci90[1]), 0) / 10) * 10;
    const c3 = chartSlot('height', W => rowChart(W, {
      rows: hRows, domain: [hLo, hHi], ticks: niceTicks(hLo, hHi, 6),
      mark: (r, x, mid) => { const l = r.p.latest; return `<line x1="${x(l.height)}" x2="${x(l.ci90[0])}" y1="${mid}" y2="${mid}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2 3"/>` +
        `<line x1="${x(l.ci90[0])}" x2="${x(l.ci90[1])}" y1="${mid}" y2="${mid}" stroke="var(--st-1)" stroke-width="2"/>` +
        `<rect x="${x(l.ci50[0])}" y="${mid - 5}" width="${x(l.ci50[1]) - x(l.ci50[0])}" height="10" rx="3" fill="var(--st-2)"/>` +
        `<line x1="${x(l.pah)}" x2="${x(l.pah)}" y1="${mid - 7}" y2="${mid + 7}" stroke="var(--ink)" stroke-width="2"/>` +
        `<circle cx="${x(l.height)}" cy="${mid}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`; }
    }));

    const vel = list.filter(p => p.hv != null);
    const hvMax = Math.max(st.heightTempo[1] + 2, ...vel.map(p => p.hv));
    const hvMin = Math.min(0, ...vel.map(p => p.hv));
    const c4 = chartSlot('hv', W => rowChart(W, {
      rows: rowsBy(vel, p => p.hv).map(p => ({ id: p.id, label: p.name, tip: `<b>${esc(p.name)}</b><br>${f(p.hv)} cm/yr over ${p.velDays} days (${sgn(p.latest.vel.dh, 1)} cm)<br>${esc(p.heightTempo)} tempo`, p })),
      domain: [Math.floor(hvMin), Math.ceil(hvMax)], ticks: niceTicks(Math.floor(hvMin), Math.ceil(hvMax), 6),
      guides: [{ v: st.heightTempo[1], label: `High ≥ ${st.heightTempo[1]}`, hot: true, anchor: 'end' }],
      mark: (r, x, mid) => bar(x(0), x(r.p.hv), mid, 12, TEMPO_COL[r.p.heightTempoIdx]) + `<text x="${x(Math.max(0, r.p.hv)) + 5}" y="${mid + 4}">${f(r.p.hv)}</text>`,
      emptyText: 'Growth rates need two or more measurements per player.'
    }));
    const wvMax = Math.max(st.weightTempo[1] + 2, ...vel.map(p => p.wv)), wvMin = Math.min(0, ...vel.map(p => p.wv));
    const c5 = chartSlot('wv', W => rowChart(W, {
      rows: rowsBy(vel, p => p.wv).map(p => ({ id: p.id, label: p.name, tip: `<b>${esc(p.name)}</b><br>${f(p.wv)} kg/yr over ${p.velDays} days (${sgn(p.latest.vel.dm, 1)} kg)<br>${esc(p.weightTempo)} tempo`, p })),
      domain: [Math.floor(wvMin), Math.ceil(wvMax)], ticks: niceTicks(Math.floor(wvMin), Math.ceil(wvMax), 6),
      guides: [{ v: st.weightTempo[1], label: `High ≥ ${st.weightTempo[1]}`, anchor: 'end' }],
      mark: (r, x, mid) => bar(x(0), x(r.p.wv), mid, 12, TEMPO_COL[r.p.weightTempoIdx]) + `<text x="${x(Math.max(0, r.p.wv)) + 5}" y="${mid + 4}">${f(r.p.wv)}</text>`,
      emptyText: 'Growth rates need two or more measurements per player.'
    }));
    const noVel = list.filter(p => p.hv == null);

    const charts = `<div class="grid2">
      <section class="panel"><div class="panel-head"><div><h3>Maturity status</h3><p class="sub">Current height as % of predicted adult height</p></div>${legend(G.STATUS, STATUS_COL)}</div>${c1}</section>
      <section class="panel"><div class="panel-head"><div><h3>Maturity timing</h3><p class="sub">Biological minus chronological age, years</p></div>${legend(G.TIMING, TIMING_COL)}</div>${c2}</section>
      <section class="panel"><div class="panel-head"><div><h3>Predicted adult height</h3><p class="sub">Current height, prediction and its 50% and 90% ranges, cm</p></div>
        <div class="legend"><span><i style="background:var(--accent);border-radius:50%"></i>Height now</span><span><i style="background:var(--ink);width:3px"></i>Prediction</span><span><i style="background:var(--st-2)"></i>50% range</span><span><i style="background:var(--st-1);height:2px;vertical-align:3px"></i>90% range</span></div></div>${c3}</section>
      <section class="panel"><div class="panel-head"><div><h3>Growth rate · height</h3><p class="sub">cm/year since the previous measurement</p></div>${legend(G.TEMPO, TEMPO_COL)}</div>${c4}
        ${noVel.length ? `<p class="sub">Single measurement so far: ${noVel.map(p => esc(p.name)).join(', ')}</p>` : ''}</section>
      <section class="panel"><div class="panel-head"><div><h3>Growth rate · body mass</h3><p class="sub">kg/year since the previous measurement</p></div>${legend(G.TEMPO, TEMPO_COL)}</div>${c5}</section>
      ${comp}
    </div>`;

    return fsel + tiles + charts + squadTable(list);
  }

  function squadTable(list) {
    const cols = [
      ['name', 'Player', p => p.name, p => `<b>${esc(p.name)}</b>`],
      ['squad', 'Squad', p => p.squad || '', p => esc(p.squad || '—')],
      ['sex', 'Sex', p => p.sex, p => p.sex === 'M' ? 'M' : 'F'],
      ['date', 'Last test', p => p.latest ? G.parseDate(p.latest.date).getTime() : 0, p => p.latest ? fmtDate(p.latest.date) : '—'],
      ['age', 'CA', p => p.latest?.age, p => f(p.latest?.age, 2), 1],
      ['ba', 'BA', p => p.latest?.ba, p => f(p.latest?.ba, 2), 1],
      ['diff', 'BA−CA', p => p.latest?.baDiff, p => sgn(p.latest?.baDiff), 1],
      ['timing', 'Timing', p => p.latest?.timingIdx, p => timingPill(p.latest)],
      ['height', 'Height', p => p.latest?.height, p => f(p.latest?.height), 1],
      ['mass', 'Mass', p => p.latest?.mass, p => f(p.latest?.mass), 1],
      ['pah', 'PAH', p => p.latest?.pah, p => f(p.latest?.pah), 1],
      ['ci', '90% range', p => p.latest?.ci90?.[0], p => p.latest?.ci90 ? `${f(p.latest.ci90[0])}–${f(p.latest.ci90[1])}` : '—', 1],
      ['pct', '% PAH', p => p.latest?.pct, p => f(p.latest?.pct), 1],
      ['status', 'Status', p => p.latest?.statusIdx, p => statusPill(p.latest)],
      ['hv', 'cm/yr', p => p.hv, p => f(p.hv), 1],
      ['wv', 'kg/yr', p => p.wv, p => f(p.wv), 1],
      ['flags', 'Flags', p => p.flags.length, p => flagsHTML(p.flags)]
    ];
    const c = cols.find(c => c[0] === S.sort.key) || cols[12];
    const sorted = list.slice().sort((a, b) => {
      const va = c[2](a), vb = c[2](b);
      if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
      return (typeof va === 'string' ? va.localeCompare(vb, undefined, { numeric: true }) : va - vb) * S.sort.dir;
    });
    return `<section class="grid" style="gap:10px"><div class="panel-head" style="margin:0"><h3>All players</h3><span class="sub">Select a row to open the player. Sorted by ${esc(c[1])}.</span></div>
      <div class="table-wrap"><table><thead><tr>${cols.map(col => `<th class="${col[4] ? 'n' : ''}" aria-sort="${S.sort.key === col[0] ? (S.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-sort="${col[0]}">${col[1]}${S.sort.key === col[0] ? (S.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('')}</tr></thead>
      <tbody>${sorted.map(p => `<tr class="click" data-pid="${esc(p.id)}" tabindex="0">${cols.map(col => `<td class="${col[4] ? 'n' : ''}">${col[3](p)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="empty">No players match these filters.</td></tr>`}</tbody></table></div></section>`;
  }

  // Half-circle gauge: coloured bands, a needle at the value, the value and its band underneath.
  function gaugeChart(W, { min, max, bands, value, valueText, bandText, bandColor }) {
    const r = Math.min(W / 2 - 14, 120), th = Math.max(14, r * 0.2), cx = W / 2, cy = r + th / 2 + 8, H = cy + 58;
    const ang = v => Math.PI * (1 - (Math.max(min, Math.min(max, v)) - min) / (max - min));
    const pt = (a, rr) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
    let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(valueText + ' ' + (bandText || ''))}">`;
    for (const b of bands) {
      const a0 = ang(b.from), a1 = ang(b.to); if (a0 - a1 < 1e-3) continue;
      const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
      s += `<path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" fill="none" stroke="${b.color}" stroke-width="${th}" ${tipAttr(`<b>${esc(b.label)}</b>`)}/>`;
      const [lx, ly] = pt((a0 + a1) / 2, r - th / 2 - 12);
      if (W >= 240 && b.short) s += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" class="gl">${esc(b.short)}</text>`;
    }
    for (const b of bands.slice(1)) { const [x0, y0] = pt(ang(b.from), r - th / 2), [x1, y1] = pt(ang(b.from), r + th / 2); s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--surface)" stroke-width="2"/>`; }
    if (value != null && isFinite(value)) {
      const a = ang(value), [nx, ny] = pt(a, r + th / 2 + 2), [bx, by] = pt(a, r - th / 2 - 4);
      s += `<line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="var(--ink)"/>`;
      s += `<line x1="${bx}" y1="${by}" x2="${nx}" y2="${ny}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
    }
    s += `<text x="${cx}" y="${cy + 30}" text-anchor="middle" style="font:italic 800 24px var(--font-display);fill:var(--ink)">${esc(valueText)}</text>`;
    if (bandText) s += `<text x="${cx}" y="${cy + 50}" text-anchor="middle" style="font:600 13px var(--font-body);fill:${bandColor || 'var(--ink-2)'}">${esc(bandText)}</text>`;
    return s + '</svg>';
  }
  // Where the player sits now, in four gauges with a sentence each for parents.
  function playerGauges(p) {
    const l = p.latest || {}, st = S.settings;
    if (!l.date) return '';
    const cuts = st.statusCuts, tc = st.timingCuts, ht = st.heightTempo, wt = st.weightTempo;
    const box = (id, title, body, note) => `<section class="panel gauge"><span class="label">${title}</span>${body}<p class="sub">${note}</p></section>`;
    const missing = msg => `<div class="empty" style="min-height:120px">${esc(msg)}</div>`;
    const status = l.pct != null ? chartSlot('g-status', W => gaugeChart(W, { min: 70, max: 100, value: l.pct, valueText: f(l.pct) + '%', bandText: l.status, bandColor: 'var(--ink)',
      bands: [70, ...cuts].map((c, i) => ({ from: c, to: [...cuts, 100][i], color: STATUS_COL[i], label: G.STATUS[i], short: ['Pre', 'Appr.', 'Circa', 'Post'][i] })) })) : missing('Needs parents\' heights, height and weight.');
    const yrs = Math.abs(l.baDiff || 0).toFixed(1);
    const timing = l.baDiff != null ? chartSlot('g-timing', W => gaugeChart(W, { min: -2, max: 2, value: l.baDiff, valueText: sgn(l.baDiff) + ' yrs', bandText: l.timing,
      bands: [[-2, -tc[1]], [-tc[1], -tc[0]], [-tc[0], tc[0]], [tc[0], tc[1]], [tc[1], 2]].map(([a, b], i) => ({ from: a, to: b, color: TIMING_COL[i], label: G.TIMING[i], short: ['Late', '', 'On time', '', 'Early'][i] })) })) : missing('Needs a height prediction first.');
    const tempoBands = (cut, max) => [[0, cut[0]], [cut[0], cut[1]], [cut[1], max]].map(([a, b], i) => ({ from: a, to: b, color: TEMPO_COL[i], label: G.TEMPO[i], short: G.TEMPO[i] }));
    const hv = p.hv != null ? chartSlot('g-hv', W => gaugeChart(W, { min: 0, max: 12, value: Math.max(0, p.hv), valueText: f(p.hv) + ' cm/yr', bandText: p.heightTempo + ' growth', bands: tempoBands(ht, 12) })) : missing('Needs two height measurements.');
    const wv = p.wv != null ? chartSlot('g-wv', W => gaugeChart(W, { min: 0, max: 10, value: Math.max(0, p.wv), valueText: f(p.wv) + ' kg/yr', bandText: p.weightTempo + ' gain', bands: tempoBands(wt, 10) })) : missing('Needs two weight measurements.');
    const statusNote = l.pct == null ? '' : l.statusIdx === 0 ? `Has reached ${f(l.pct)}% of predicted adult height. The biggest growth spurt is still ahead (it usually peaks around 91–92%).`
      : l.statusIdx === 1 ? `Has reached ${f(l.pct)}% of predicted adult height and is heading into the main growth spurt.`
      : l.statusIdx === 2 ? `Has reached ${f(l.pct)}% of predicted adult height: in or around the fastest growth. Coordination and aches can change for a while; training is adjusted to suit.`
      : `Has reached ${f(l.pct)}% of predicted adult height: past the main growth spurt.`;
    const timingNote = l.baDiff == null ? '' : l.timingIdx === 2 ? 'Maturing at about the same pace as most children the same age.'
      : l.baDiff < 0 ? `Maturing later than most children the same age, by about ${yrs} years. Late developers often catch up and overtake; it is normal.`
      : `Maturing earlier than most children the same age, by about ${yrs} years. Early size and strength can flatter performance for a while.`;
    const hvNote = p.hv == null ? '' : `${f(p.hv)} cm a year over the last ${p.velDays} days. ${p.heightTempoIdx === 2 ? 'This is a fast growth phase, when growing pains and injury risk rise, so load is managed carefully.' : p.heightTempoIdx === 1 ? 'A steady rate of growth.' : 'Growing slowly at the moment.'}`;
    const wvNote = p.wv == null ? '' : `${f(p.wv)} kg a year over the same period. ${p.weightTempoIdx === 2 ? 'Fast weight gain, usually alongside a growth spurt.' : p.weightTempoIdx === 1 ? 'A steady rate of weight gain.' : 'Little weight change at the moment.'}`;
    return `<div class="grid4 gauges">${box('s', 'Maturity status', status, statusNote)}${box('t', 'Maturity timing', timing, timingNote)}${box('h', 'Height growth', hv, hvNote)}${box('w', 'Weight gain', wv, wvNote)}</div>`;
  }

  function viewPlayer() {
    const all = filtered().length ? filtered() : profiles();
    if (!all.length) return `<div class="panel"><h2>No players yet</h2><p class="note">Add a player on the Record tab, import a spreadsheet on the Data tab, or use the calculator and choose "Add to squad".</p></div>`;
    let p = profiles().find(x => x.id === S.playerId) || all[0];
    S.playerId = p.id;
    const idx = all.findIndex(x => x.id === p.id);
    const l = p.latest || {};
    const st = S.settings;
    const sorted = all.slice().sort((a, b) => a.name.localeCompare(b.name));
    const picker = `<div class="bar">
      <label class="field" style="flex:1;min-width:200px;max-width:340px"><span>Player</span><select id="pick">${sorted.map(x => `<option value="${esc(x.id)}" ${x.id === p.id ? 'selected' : ''}>${esc(x.name)}${x.squad ? ' · ' + esc(x.squad) : ''}</option>`).join('')}</select></label>
      <button class="btn" data-nav="-1" ${idx <= 0 ? 'disabled' : ''}>Previous</button><button class="btn" data-nav="1" ${idx < 0 || idx >= all.length - 1 ? 'disabled' : ''}>Next</button></div>`;

    const head = `<div class="player-head"><div><span class="label">${esc(p.squad || 'No squad')} · ${p.sex === 'M' ? 'Boy' : 'Girl'}${p.example ? ' · example player' : ''}</span><h2>${esc(p.name)}</h2>
      <div class="facts"><span>Born ${fmtDate(p.dob)}</span><span>Age today ${f(p.ageNow, 1)}</span><span>Mother ${f(p.mother)} cm · Father ${f(p.father)} cm</span><span>${p.history.length} measurement${p.history.length === 1 ? '' : 's'}</span></div></div>
      ${flagsHTML(p.flags)}</div>`;

    const cuts = st.statusCuts, lo = 70, span = 100 - lo, pos = v => Math.max(0, Math.min(100, (v - lo) / span * 100));
    const meter = l.pct ? `<div class="meter" aria-label="${f(l.pct)}% of predicted adult height">
        ${[lo, ...cuts].map((c, i) => `<div class="seg-b" style="left:${pos(c)}%;width:${pos([...cuts, 100][i]) - pos(c)}%;background:${STATUS_COL[i]};opacity:.55;${i === 0 ? 'border-radius:6px 0 0 6px;' : ''}${i === 3 ? 'border-radius:0 6px 6px 0;' : ''}"></div>`).join('')}
        <div class="mark" style="left:${pos(l.pct)}%"></div>
        ${[lo, ...cuts, 100].map(c => `<span class="tick" style="left:${pos(c)}%">${c}</span>`).join('')}</div>` : '';

    const cards = l.pah ? `<div class="grid4">
      <section class="panel"><span class="label">Age</span><dl class="kv" style="margin-top:10px">
        <dt>Chronological</dt><dd>${f(l.age, 2)}</dd><dt>Biological</dt><dd>${l.baCapped === 'high' ? '≥ ' : ''}${f(l.ba, 2)}</dd><dt>BA − CA</dt><dd class="big">${sgn(l.baDiff)}</dd><dt>Timing</dt><dd>${timingPill(l)}</dd></dl></section>
      <section class="panel"><span class="label">Maturity status</span><dl class="kv" style="margin-top:10px"><dt>% predicted adult height</dt><dd class="big">${f(l.pct)}%</dd></dl>${meter}<div>${statusPill(l)}</div></section>
      <section class="panel"><span class="label">Height prediction</span><dl class="kv" style="margin-top:10px">
        <dt>Predicted adult height</dt><dd class="big">${f(l.pah)}<small style="font:500 13px var(--font-body);color:var(--muted)"> cm</small></dd>
        <dt>50% range</dt><dd>${f(l.ci50[0])}–${f(l.ci50[1])}</dd><dt>90% range</dt><dd>${f(l.ci90[0])}–${f(l.ci90[1])}</dd><dt>Growth remaining</dt><dd>${f(l.remaining)} cm</dd></dl></section>
      <section class="panel"><span class="label">Growth since last measurement</span><dl class="kv" style="margin-top:10px">
        <dt>Height</dt><dd class="big">${f(p.hv)}<small style="font:500 13px var(--font-body);color:var(--muted)"> cm/yr</small></dd><dt>Body mass</dt><dd>${f(p.wv)} kg/yr</dd>
        <dt>Interval</dt><dd>${p.velDays != null ? p.velDays + ' days' : '—'}</dd><dt>Over ~12 months</dt><dd>${l.vel12 ? f(l.vel12.hv) + ' cm/yr' : '—'}</dd>
        <dt>Tempo</dt><dd>${tempoPill(p.heightTempo, p.heightTempoIdx)}</dd></dl></section>
    </div>` : `<div class="panel"><p class="note">${esc((l.issues || ['No measurements yet.']).join(' '))} Add the missing details below.</p></div>`;

    const H = p.history.filter(a => a.height > 0);
    const T = a => G.parseDate(a.date).getTime();
    const preds = H.filter(a => a.pah);
    const hAll = H.map(a => a.height).concat(preds.flatMap(a => a.ci90));
    const hc = chartSlot('p-height', W => timeChart(W, {
      series: [
        { color: 'var(--accent)', points: H.map(a => ({ t: T(a), v: a.height, tip: `<b>${fmtDate(a.date)}</b><br>Height ${f(a.height)} cm` })) },
        { color: 'var(--ink-2)', dash: true, points: preds.map(a => ({ t: T(a), v: a.pah, tip: `<b>${fmtDate(a.date)}</b><br>Predicted adult ${f(a.pah)} cm<br>90%: ${f(a.ci90[0])}–${f(a.ci90[1])}` })) }
      ],
      band: preds.map(a => ({ t: T(a), lo: a.ci90[0], hi: a.ci90[1], color: 'var(--st-2)' })),
      yDomain: [Math.floor((Math.min(...hAll) - 3) / 5) * 5, Math.ceil((Math.max(...hAll) + 3) / 5) * 5]
    }));
    const pc = chartSlot('p-pct', W => timeChart(W, {
      series: [{ color: 'var(--ink)', points: preds.map(a => ({ t: T(a), v: a.pct, tip: `<b>${fmtDate(a.date)}</b><br>${f(a.pct)}% PAH · ${esc(a.status)}<br>BA−CA ${sgn(a.baDiff)} · ${esc(a.timing)}` })) }],
      yBands: [lo, ...cuts].map((c, i) => ({ from: c, to: [...cuts, 100][i], color: STATUS_COL[i] })),
      guides: cuts.map(v => ({ v })),
      yDomain: [Math.min(lo, ...preds.map(a => Math.floor(a.pct) - 2)), 100], yFmt: v => v + '%'
    }));
    const ints = p.history.filter(a => a.vel);
    const vc = chartSlot('p-hv', W => intervalChart(W, {
      items: ints.map(a => ({ v: a.vel.hv, label: new Date(T(a)).toLocaleDateString('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' }), color: TEMPO_COL[Math.min(2, [0, 1, 2].filter(i => a.vel.hv >= [-Infinity, ...st.heightTempo][i]).pop())],
        tip: `<b>${fmtDate(a.date)}</b><br>${f(a.vel.hv)} cm/yr<br>${sgn(a.vel.dh, 1)} cm over ${a.vel.days} days` })),
      guide: { v: st.heightTempo[1], label: `High ≥ ${st.heightTempo[1]}` }, emptyText: 'Needs two or more measurements.'
    }));
    const wc = chartSlot('p-wv', W => intervalChart(W, {
      items: ints.map(a => ({ v: a.vel.wv, label: new Date(T(a)).toLocaleDateString('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' }), color: TEMPO_COL[Math.min(2, [0, 1, 2].filter(i => a.vel.wv >= [-Infinity, ...st.weightTempo][i]).pop())],
        tip: `<b>${fmtDate(a.date)}</b><br>${f(a.vel.wv)} kg/yr<br>${sgn(a.vel.dm, 1)} kg over ${a.vel.days} days` })),
      emptyText: 'Needs two or more measurements.'
    }));
    const charts = `<div class="grid2">
      <section class="panel"><div class="panel-head"><div><h3>Height and prediction</h3><p class="sub">cm, with the 90% range of each prediction</p></div>
        <div class="legend"><span><i style="background:var(--accent)"></i>Height</span><span><i style="background:var(--ink-2)"></i>Predicted adult height</span><span><i style="background:var(--st-2);opacity:.4"></i>90% range</span></div></div>${hc}</section>
      <section class="panel"><div class="panel-head"><div><h3>Maturity status over time</h3><p class="sub">% of predicted adult height; shaded by status band</p></div>${legend(G.STATUS, STATUS_COL)}</div>${pc}</section>
      <section class="panel"><div class="panel-head"><div><h3>Height velocity</h3><p class="sub">cm/year for each interval between measurements</p></div>${legend(G.TEMPO, TEMPO_COL)}</div>${vc}</section>
      <section class="panel"><div class="panel-head"><div><h3>Body mass velocity</h3><p class="sub">kg/year for each interval between measurements</p></div>${legend(G.TEMPO, TEMPO_COL)}</div>${wc}</section>
    </div>`;

    const conf = S.confirm;
    const rows = p.history.slice().reverse().map(a => {
      const k = 'del-a:' + a.date;
      return `<tr><td>${fmtDate(a.date)}</td><td class="n">${f(a.age, 2)}</td><td class="n">${f(a.height)}</td><td class="n">${f(a.mass)}</td><td class="n">${f(a.pah)}</td><td class="n">${f(a.pct)}</td><td>${statusPill(a.status ? a : null)}</td><td class="n">${f(a.ba, 2)}</td><td>${timingPill(a.timing ? a : null)}</td><td class="n">${a.vel ? f(a.vel.hv) : '—'}</td><td class="n">${a.vel ? f(a.vel.wv) : '—'}</td>
        <td>${conf === k ? `<span class="confirm"><button class="btn small danger" data-del-a="${esc(a.date)}">Delete</button><button class="btn small" data-cancel>Keep</button></span>` : `<button class="btn small" data-ask="${esc(k)}">Remove</button>`}</td></tr>`;
    }).join('');
    const hist = `<section class="grid" style="gap:10px"><h3>Measurements</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th class="n">Age</th><th class="n">Height cm</th><th class="n">Mass kg</th><th class="n">PAH cm</th><th class="n">% PAH</th><th>Status</th><th class="n">BA</th><th>Timing</th><th class="n">cm/yr</th><th class="n">kg/yr</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="12" class="empty">No measurements yet.</td></tr>'}</tbody></table></div></section>`;

    const addForm = `<section class="panel"><div class="panel-head"><h3>Add a measurement</h3><span class="sub">Measure within ±7 days of testing or competition where you can</span></div>
      <form id="add-a" class="form-grid">
        <label class="field"><span>Date</span><input type="date" id="a-date" value="${todayISO()}" required></label>
        <label class="field"><span>Standing height (cm)</span><input type="number" id="a-height" step="0.1" min="60" max="230" required></label>
        <label class="field"><span>Body mass (kg)</span><input type="number" id="a-mass" step="0.1" min="10" max="180" required></label>
        <div class="field" style="align-self:end"><button class="btn primary" type="submit">Add measurement</button></div>
      </form><p class="err" id="a-msg" role="status">${esc(S.msg.a || '')}</p></section>`;

    const editForm = `<section class="panel"><div class="panel-head"><h3>Player details</h3>${conf === 'del-p' ? `<span class="confirm"><span class="err">Delete ${esc(p.name)} and all their measurements?</span><button class="btn small danger" data-del-p>Delete player</button><button class="btn small" data-cancel>Keep</button></span>` : `<button class="btn small danger" data-ask="del-p">Delete player</button>`}</div>
      <form id="edit-p" class="form-grid">${playerFields(p, 'e')}<div class="field" style="align-self:end"><button class="btn" type="submit">Save details</button></div></form>
      <p class="ok" role="status">${esc(S.msg.e || '')}</p></section>`;

    return picker + head + playerGauges(p) + cards + charts + hist + playerPerf(p) + `<div class="grid2">${addForm}${editForm}</div>`;
  }

  const playerFields = (p = {}, pre) => `
    <label class="field"><span>Name</span><input type="text" id="${pre}-name" value="${esc(p.name || '')}" required></label>
    <label class="field"><span>Sex</span><select id="${pre}-sex"><option value="M" ${p.sex === 'M' ? 'selected' : ''}>Male</option><option value="F" ${p.sex === 'F' ? 'selected' : ''}>Female</option></select></label>
    <label class="field"><span>Date of birth</span><input type="date" id="${pre}-dob" value="${esc(p.dob || '')}" required></label>
    <label class="field"><span>Squad</span><input type="text" id="${pre}-squad" value="${esc(p.squad || '')}" placeholder="e.g. U13" list="squad-list"></label>
    <label class="field"><span>Mother's height (cm)</span><input type="number" id="${pre}-mother" step="0.1" min="120" max="220" value="${p.mother ?? ''}"></label>
    <label class="field"><span>Father's height (cm)</span><input type="number" id="${pre}-father" step="0.1" min="120" max="230" value="${p.father ?? ''}"></label>
    <datalist id="squad-list">${squads().map(s => `<option value="${esc(s)}">`).join('')}</datalist>`;
  const readPlayerFields = pre => ({
    name: $(`#${pre}-name`).value.trim(), sex: $(`#${pre}-sex`).value, dob: $(`#${pre}-dob`).value, squad: $(`#${pre}-squad`).value.trim(),
    mother: parseFloat($(`#${pre}-mother`).value) || null, father: parseFloat($(`#${pre}-father`).value) || null
  });

  // ---- calculator ----
  const CALC_DEFAULT = { name: '', sex: 'M', date: '2026-10-03', dob: '2012-10-06', mass: 50, height: 160, mother: 165, father: 180 };
  let calc = { ...CALC_DEFAULT };
  function viewCalculator() {
    return `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))">
      <section class="panel"><div class="panel-head"><h3>Inputs</h3><button class="linkish" id="c-reset">Reset example</button></div>
        <form id="calc" class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr))">
          <label class="field" style="grid-column:1/-1"><span>Name</span><input type="text" id="c-name" value="${esc(calc.name)}" placeholder="Optional"></label>
          <label class="field"><span>Sex</span><select id="c-sex"><option value="M" ${calc.sex === 'M' ? 'selected' : ''}>Male</option><option value="F" ${calc.sex === 'F' ? 'selected' : ''}>Female</option></select></label>
          <label class="field"><span>Test date</span><input type="date" id="c-date" value="${esc(calc.date)}"></label>
          <label class="field"><span>Date of birth</span><input type="date" id="c-dob" value="${esc(calc.dob)}"></label>
          <label class="field"><span>Body mass (kg)</span><input type="number" step="0.1" id="c-mass" value="${calc.mass}"></label>
          <label class="field"><span>Standing height (cm)</span><input type="number" step="0.1" id="c-height" value="${calc.height}"></label>
          <label class="field"><span>Mother's height (cm)</span><input type="number" step="0.1" id="c-mother" value="${calc.mother}"></label>
          <label class="field"><span>Father's height (cm)</span><input type="number" step="0.1" id="c-father" value="${calc.father}"></label>
        </form></section>
      <section class="panel" id="calc-out">${calcOut()}</section></div>`;
  }
  function calcOut() {
    const p = { sex: calc.sex, dob: calc.dob, mother: +calc.mother, father: +calc.father };
    if (!G.parseDate(calc.dob) || !G.parseDate(calc.date)) return '<p class="note">Enter a test date and date of birth.</p>';
    const r = G.assess(p, { date: calc.date, height: +calc.height, mass: +calc.mass }, S.settings);
    if (!r.pah) return `<p class="err">${esc(r.issues.join(' '))}</p>`;
    return `<div class="panel-head"><h3>${esc(calc.name || 'Result')}</h3><span class="sub">Tested ${fmtDate(calc.date)}</span></div>
      <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:20px">
        <div><span class="label">Age</span><dl class="kv" style="margin-top:8px"><dt>Chronological age</dt><dd>${f(r.age, 2)}</dd><dt>Biological age</dt><dd>${f(r.ba, 2)}</dd><dt>BA − CA</dt><dd>${sgn(r.baDiff)}</dd></dl></div>
        <div><span class="label">Maturity</span><dl class="kv" style="margin-top:8px"><dt>Status</dt><dd>${statusPill(r)}</dd><dt>Timing</dt><dd>${timingPill(r)}</dd></dl></div>
        <div><span class="label">Height prediction</span><dl class="kv" style="margin-top:8px"><dt>Predicted adult height</dt><dd class="big">${f(r.pah)}</dd><dt>% of adult height</dt><dd>${f(r.pct)}%</dd><dt>Growth remaining</dt><dd>${f(r.remaining)} cm</dd></dl></div>
        <div><span class="label">Height bounds</span><dl class="kv" style="margin-top:8px"><dt>50% range</dt><dd>${f(r.ci50[0])}–${f(r.ci50[1])}</dd><dt>90% range</dt><dd>${f(r.ci90[0])}–${f(r.ci90[1])}</dd></dl></div>
      </div>
      <div class="bar" style="margin-top:18px"><button class="btn primary" id="c-add">Add to squad</button><span class="sub" id="c-msg">${esc(S.msg.c || 'Adds a new player, or a new measurement if the name and date of birth already exist.')}</span></div>`;
  }

  // ---- data ----
  // ---- record: a testing session for a whole squad ----
  function sessionCheck(p, hRaw, mRaw, date) {
    const h = G.heightCm(hRaw), m = parseFloat(mRaw);
    if (!(h > 0) && !(m > 0)) return '';
    const prev = [...p.history].filter(a => a.date < date).pop();
    if (!prev) return '<span class="sub">First measurement</span>';
    const days = G.daysBetween(prev.date, date), out = [];
    if (h > 0) {
      const dh = h - prev.height, rate = days > 0 ? dh / days * 365.25 : null;
      out.push(`${sgn(dh, 1)} cm${rate != null && days >= 14 ? ` · ${f(rate)} cm/yr` : ''}`);
      if (dh < -0.5) out.push('<span class="err">lower than last time</span>');
      else if (rate != null && days >= 14 && rate > 15) out.push('<span class="err">very fast: check</span>');
    }
    if (m > 0 && Math.abs(m - prev.mass) > 8) out.push('<span class="err">mass changed by ' + f(Math.abs(m - prev.mass)) + ' kg</span>');
    return out.join(' · ');
  }
  function viewRecord() {
    const sq = squads(), ses = S.session;
    if (!ses.date) ses.date = todayISO();
    if (!sq.includes(ses.squad)) ses.squad = sq[0] || '';
    const list = profiles().filter(p => (p.squad || 'No squad') === ses.squad).sort((a, b) => a.name.localeCompare(b.name));
    const filled = list.filter(p => { const v = ses.vals[p.id]; return v && G.heightCm(v.h) > 0 && parseFloat(v.m) > 0; }).length;
    const rows = list.map(p => {
      const v = ses.vals[p.id] || {}, l = p.latest;
      return `<tr><td><b>${esc(p.name)}</b><div class="sub">${p.sex === 'M' ? 'Boy' : 'Girl'} · age ${f(G.decimalAge(p.dob, ses.date), 1)}</div></td>
        <td>${l ? `${fmtDate(l.date)}<div class="sub">${f(l.height)} cm · ${f(l.mass)} kg</div>` : '<span class="sub">None yet</span>'}</td>
        <td><input type="number" step="0.1" min="60" max="230" inputmode="decimal" id="sh-${esc(p.id)}" data-sid="${esc(p.id)}" data-k="h" value="${esc(v.h || '')}" aria-label="Height for ${esc(p.name)}" style="width:96px"></td>
        <td><input type="number" step="0.1" min="10" max="180" inputmode="decimal" id="sm-${esc(p.id)}" data-sid="${esc(p.id)}" data-k="m" value="${esc(v.m || '')}" aria-label="Body mass for ${esc(p.name)}" style="width:96px"></td>
        <td id="sc-${esc(p.id)}" style="white-space:normal;min-width:160px">${sessionCheck(p, v.h, v.m, ses.date)}</td></tr>`;
    }).join('');
    return `<section class="panel"><div class="panel-head"><div><h3>Record a testing session</h3><p class="sub">Enter today's heights and body masses for a squad, then save them all at once. Leave a row blank to skip a player.</p></div></div>
      <div class="bar" style="margin-bottom:14px">
        <label class="field" style="width:170px"><span>Squad</span><select id="ses-squad">${sq.map(s => `<option ${s === ses.squad ? 'selected' : ''}>${esc(s)}</option>`).join('') || '<option value="">No squads yet</option>'}</select></label>
        <label class="field" style="width:170px"><span>Test date</span><input type="date" id="ses-date" value="${esc(ses.date)}"></label>
        <span class="sub" id="ses-count">${filled} of ${list.length} filled in</span>
        <button class="btn primary" id="ses-save" style="margin-left:auto">Save session</button>
      </div>
      ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Player</th><th>Last measured</th><th>Height (cm)</th><th>Body mass (kg)</th><th>Change since last</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">No players in this squad yet. Add them below or import a spreadsheet on the Data tab.</p>'}
      <p role="status" style="margin-top:10px">${S.msg.ses || ''}</p></section>
      <section class="panel"><div class="panel-head"><h3>Add a player</h3><span class="sub">Measurements are optional here; parent heights are needed for predictions</span></div>
        <form id="new-p" class="form-grid">${playerFields({ sex: 'M', squad: ses.squad }, 'n')}
          <label class="field"><span>Test date</span><input type="date" id="n-date" value="${todayISO()}"></label>
          <label class="field"><span>Height (cm)</span><input type="number" id="n-height" step="0.1"></label>
          <label class="field"><span>Body mass (kg)</span><input type="number" id="n-mass" step="0.1"></label>
          <div class="field" style="align-self:end"><button class="btn primary" type="submit">Add player</button></div></form>
        <p class="ok" role="status">${esc(S.msg.n || '')}</p></section>`;
  }

  // ---- data: import, export, settings ----
  const colName = i => { let s = ''; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; };
  function setImport(sheets, fileName) {
    let best = 0, bestScore = -1;
    sheets.forEach((sh, i) => { const h = G.detectHeader(sh.rows); const m = G.autoMap(sh.rows[h] || []); const sc = Object.values(m).filter(v => v >= 0).length; if (sc > bestScore) { best = i; bestScore = sc; } });
    S.imp = { fileName, sheets, sheet: best };
    remapImport();
  }
  function remapImport(keepHeader) {
    const sh = S.imp.sheets[S.imp.sheet];
    if (!keepHeader) S.imp.header = G.detectHeader(sh.rows);
    S.imp.map = G.autoMap(sh.rows[S.imp.header] || []);
  }
  function importResult() {
    const sh = S.imp.sheets[S.imp.sheet];
    return G.playersFromRows(sh.rows, S.imp.header, S.imp.map, S.players);
  }
  function importArea() {
    if (!S.imp) return '';
    const sh = S.imp.sheets[S.imp.sheet], heads = sh.rows[S.imp.header] || [];
    const map = S.imp.map;
    const missing = map.name < 0 && map.surname < 0 ? [['name', 'Name']] : [];
    const byName = map.sex < 0 || map.dob < 0;
    const res = missing.length ? null : importResult();
    const opts = sel => `<option value="-1">Not in file</option>` + heads.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${colName(i)} · ${esc(String(h).slice(0, 40) || '(blank)')}</option>`).join('');
    const sample = res ? res.players.slice(0, 6).flatMap(p => (p.assessments.length ? p.assessments.slice(-1) : [{}]).map(a => `<tr><td>${esc(p.name)}</td><td>${p.sex}</td><td>${fmtDate(p.dob)}</td><td>${esc(p.squad || '—')}</td><td class="n">${f(p.mother)}</td><td class="n">${f(p.father)}</td><td>${a.date ? fmtDate(a.date) : '—'}</td><td class="n">${f(a.height)}</td><td class="n">${f(a.mass)}</td></tr>`)).join('') : '';

        <label class="field" style="width:120px"><span>Header row</span><input type="number" id="imp-header" min="1" max="${sh.rows.length}" value="${S.imp.header + 1}"></label>
